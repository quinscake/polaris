    // the pieces
    var LBL = listLabel(p), kindPh = 'Add a stage, like “draft the essay dec 10”';
    var tasksSec = '<section class="hsec hsec-tasks" aria-labelledby="hs-tasks"><div class="hsec-h"><h3 id="hs-tasks">' + LBL + '</h3><span class="count">' + (Popen.length || '') + '</span></div>' +
      (ro ? '' : '<form id="task-add" class="task-add" novalidate autocomplete="off">' +
        '<div class="when-chip" id="ta-when" hidden></div>' +
        '<label for="ta-title" class="sr-only">New item</label><input id="ta-title" data-keep data-focus="tasks" type="text" maxlength="2100" placeholder="' + kindPh + '">' +
        '<label for="ta-date" class="sr-only">Due date (optional)</label><input id="ta-date" data-keep type="date" title="Due date (optional)">' +
        '<button type="submit" class="btn btn-sm primary">Add</button></form>') +
      (Popen.length ? '<ul class="task-list pieces" data-sort-list="hub:' + esc(p.id) + '">' + Popen.map(pieceRow).join('') + '</ul>' +
          ''
        : '<p class="hub-empty">' + (P.length ? 'All stages done.' : 'No stages yet.') + '</p>') +
      '</section>';

    // archive: finished stages, kept for the record, faded at the very bottom
    var arch = P.filter(function (m) { return m.done; }).sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0) || ((a.doneOn || '') < (b.doneOn || '') ? 1 : -1); });
    var archSec = arch.length ? '<section class="hsec hsec-arch" aria-labelledby="hs-arch"><div class="hsec-h"><h3 id="hs-arch">Archive</h3><span class="count">' + arch.length + '</span></div>' +
      '<ul class="task-list arch">' + arch.map(function (m) {
        var S = stepsOf(p, m), meta = [m.doneOn ? 'done ' + (m.doneOn === T ? 'today' : fmtYear(m.doneOn)) : 'done'];
        if (S.length) meta.push(plural(S.length, 'step'));
        if (m.points) meta.push(m.points + ' pts');
        return '<li class="task piece arch-row"><div class="piece-top">' + stSelect(m) +
          '<button type="button" class="task-main" data-act="task" data-mid="' + esc(m.id) + '"><span class="task-title">' + esc(m.title) + '</span><span class="task-meta">' + esc(meta.join(' · ')) + '</span></button>' + linkA(m) + '</div></li>';
      }).join('') + '</ul>' + '</section>' : '';

    // files and links: the project's own (links on a stage stay on the stage)
    var order = { published: 0, file: 1, link: 2 };
    var L = linksOf(p).slice().sort(function (a, b) { return order[a.kind] - order[b.kind] || (a.added < b.added ? 1 : a.added > b.added ? -1 : 0); });
    var filesSec = '<section class="hsec hsec-files" aria-labelledby="hs-files"><div class="hsec-h"><h3 id="hs-files">Files &amp; links</h3><span class="count">' + (L.length || '') + '</span></div>' +
      (ro ? '' : '<form id="hub-lk" class="lk-add" novalidate autocomplete="off">' +
        '<label for="hl-url" class="sr-only">Link</label><input id="hl-url" data-keep data-focus="files" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="Paste a link: Doc, Sheet, Drive, paper, website…">' +
        '<label for="hl-name" class="sr-only">Name</label><input id="hl-name" data-keep type="text" maxlength="120" placeholder="Name (optional)">' +
        '<button type="submit" class="btn btn-sm primary">Add</button></form><p class="form-error" id="hl-error" hidden></p>') +
      (L.length ? '<ul class="lk-list">' + L.map(function (l) { return linkRowHTML(p, l); }).join('') + '</ul>' : '') +
      (!L.length ? '<p class="hub-empty">No files yet. Paste the link to a Google Doc, Drive folder, paper or web page. Tap one to add notes.</p>' : '') +
      '</section>';

    // activity: every dot on this project's line, newest first
    var shown = ui.hubAllLog ? ups : ups.slice(0, 8), lastD = null;
    var feed = shown.map(function (u) {
      var h = '';

      return h + '<li><button type="button" class="feed-item' + (u.task ? ' auto' : '') + '" data-act="open-day" data-date="' + u.date + '">' +
        (u.task ? CK : '') + '<span class="feed-text">' + esc(u.task ? u.text.replace(/^✓\s*/, 'Done: ') : u.text) +
        (u.piece && taskById(p, u.piece) ? ' <span class="feed-tag">' + esc(truncate(taskById(p, u.piece).title, 28)) + '</span>' : '') + '</span></button></li>';
    }).join('');
    var logSec = '<section class="hsec hsec-log" aria-labelledby="hs-log"><div class="hsec-h"><h3 id="hs-log">Activity</h3><span class="count">' + (ups.length || '') + '</span></div>' +
      (!ro && canAddOn(p, T, T) ? '<form id="log-add" class="log-add" novalidate>' +
        '<label for="lg-text" class="sr-only">What did you do on this today?</label><textarea id="lg-text" data-keep data-focus="log" rows="2" maxlength="2000" placeholder="What did you do on this today?"></textarea>' +
        '<button type="submit" class="btn btn-sm primary">Log</button>' +
        (P.length ? '<label for="lg-piece" class="sr-only">About</label><select id="lg-piece" data-keep class="lg-piece"><option value="">About: the whole project</option>' +
          P.map(function (m) { return '<option value="' + esc(m.id) + '">About: ' + esc(truncate(m.title, 40)) + '</option>'; }).join('') + '</select>' : '') + '</form>' : '') +
      (ups.length ? '<ol class="feed">' + feed + '</ol>' +
        (ups.length > 8 ? '<button type="button" class="link-btn hub-more" id="hub-log" data-act="hub-log">' + (ui.hubAllLog ? 'Show less' : 'Show all ' + ups.length) + '</button>' : '')
        : '<p class="hub-empty">Nothing logged yet. Each update is a dot on the timeline, and ticking a to-do adds one too.</p>') +

      '<div class="hub-acts">' + acts + '</div></header>' + (overview ? '<div class="hub-overview">' + overview + '</div>' : '') +
      '<div class="hub-body">' + tasksSec + hubNotesSec(p) + logSec + filesSec + archSec + '</div></div>';
  }

  function hubNotesSec(p) {
    if (!isResearch(p)) return '';
    var N = thNotesOf(p.id).sort(function (a, b) { return b.updated - a.updated; });
    if (!N.length) return '';
    return '<section class="hsec hsec-rnotes" aria-labelledby="hs-rnotes"><div class="hsec-h"><h3 id="hs-rnotes">Notes</h3><span class="count">' + N.length + '</span></div><ul class="hub-rnotes">' +
      N.map(function (pg) { return '<li><button type="button" class="hub-rnote" data-act="hub-th-note" data-id="' + esc(pg.id) + '"><span>' + esc(pg.title) + '</span><span class="muted">' + fmtShort(isoOf(pg.updated)) + '</span></button></li>'; }).join('') + '</ul></section>';
  }
  // Redraw the open project window, keeping whatever you were typing and where you were.
  function renderHub() {
    var box = $('#hub'); if (!box) return;
    if (!ui.hub) { box.hidden = true; return; }
    var p = getProject(ui.hub);
    if (!p) { closeHub(); return; }
    var same = box.dataset.pid === p.id, keep = {}, focusId = null, selS = null, selE = null, sc = 0;
    if (same) {
      $$('#hub [data-keep]').forEach(function (el) { keep[el.id] = el.value; });
      var ae = document.activeElement;
      if (ae && box.contains(ae) && ae.id) { focusId = ae.id; try { selS = ae.selectionStart; selE = ae.selectionEnd; } catch (e) {} }
      var pn = $('#hub .hub-panel'); if (pn) sc = pn.scrollTop;
    }
    box.dataset.pid = p.id;
    box.innerHTML = hubHTML(p, todayISO());
    Object.keys(keep).forEach(function (id) {
      if (id === 'hub-notes' && keep[id] === hubNotesBase) return;   // not edited here, so show the saved notes
      var el = document.getElementById(id); if (el) el.value = keep[id];
    });
    hubNotesBase = p.notes || '';
    if (focusId) {
      var f = document.getElementById(focusId);
      if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } try { if (selS != null) f.setSelectionRange(selS, selE); } catch (e) {} }
    }
    var pn2 = $('#hub .hub-panel'); if (pn2) pn2.scrollTop = sc;
    whenWatch('#ta-title', '#ta-when');
  }

  function openHub(pid, focus) {
    if (!getProject(pid)) return;
    if (!$('#modal').hidden) closeModal();

    if (ui.hub !== pid) { ui.hubShowDone = false; ui.hubAllLog = false; ui.hubAllTasks = false; $('#hub').dataset.pid = ''; }
    if (!ui.hub) { hubFocusBack = document.activeElement; layerOpen('hub'); }
    ui.hub = pid;
    $('#hub').hidden = false;
    document.body.classList.add('hub-open');
    renderHub();
    var f = (focus && $('#hub [data-focus="' + focus + '"]')) || $('#hub .hub-close');
    if (f) {
      try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); }
      if (focus) { try { f.scrollIntoView({ block: 'center' }); } catch (e) {} }
    }
  }
  function saveHubNotes() {
    var p = ui.hub && getProject(ui.hub), el = $('#hub-notes');

    document.body.classList.remove('hub-open');

  function openEnd(pid) {

    var T = todayISO();

    var min = lu && lu > p.start ? lu : p.start;
    if (min > T) min = T;
    openModal({
      draw: function () {
        var rsch = isResearch(p);
        $('#modal-body').innerHTML = '<h2 id="modal-title">' + (rsch ? 'Complete' : 'End') + ' “' + esc(p.name) + '”?</h2>' +
          (rsch ? '<p>It stays on your Timeline and under its stage in Research as a star, so you can come back to it.</p>'
            : '<p>Its line stops with an <b style="color:var(--stop)">✕</b> and it sinks to the bottom of the board. A week after the end date it leaves the board, but stays in the <b>Library</b> under <i>Show archived</i>.</p>') +
          '<form id="end-form" novalidate>' +
          '<div class="field"><label for="end-date">End date</label><input id="end-date" type="date" value="' + T + '" min="' + min + '" max="' + T + '"></div>' +
          '<div class="field"><label for="end-note">Final note <span class="muted">(optional)</span></label><textarea id="end-note" rows="2" placeholder="How it wrapped up, a link, the result…" autofocus></textarea></div>' +
          (rsch ? '' : '<p class="muted" id="end-leaves">Leaves the board on ' + fmtLong(addDays(T, KEEP_DAYS)) + '.</p>') +
          '<p class="form-error" id="end-error" hidden></p>' +

      },
      onSubmit: function () {
        var d = $('#end-date').value, note = $('#end-note').value.trim(), err = $('#end-error');
        if (!isISO(d) || d > T || d < min) { err.textContent = 'Pick a date between ' + fmtShort(min) + ' and today.'; err.hidden = false; return; }
        commit(function (s) {
          s.projects.forEach(function (x) { if (x.id === pid) { x.ended = d; x.endedBy = null; x.parked = null; } });
          if (note) s.updates.push({ id: uid(), projectId: pid, date: d, text: note, created: Date.now() });

  function openDeadline(pid) {
    var p = getProject(pid); if (!p || mode === 'readonly' || p.ended) return;
    var T = todayISO();
    openModal({
      draw: function () {
        var v = p.deadline ? { date: p.deadline, time: p.deadlineAt ? localTimeOf(p.deadlineAt) : '', at: p.deadlineAt, tz: p.deadlineTz } : { date: addDays(T, 7) };
        $('#modal-body').innerHTML = '<div class="modal-head" style="--pc:var(--c' + p.color + ')"><i class="dot"></i><div><h2 id="modal-title">Final deadline for “' + esc(p.name) + '”</h2>' +
          '<p class="modal-sub">' + (p.deadline ? 'Due ' + fmtLong(p.deadline) + (p.deadlineAt ? ', ' + localTimeOf(p.deadlineAt) : '') + ' (' + leftText(p, T) + ')' : 'No deadline yet') + '</p></div></div>' +
          '<p>You’ll see a reminder ' + DUE_SOON + ' days before. Once the deadline day is over, the project ends itself with an ✕ on that day. For steps inside a project, add to-dos with dates in the project window (tap the project’s name).</p>' +
          '<form id="dl-form" novalidate>' + whenFields('dl', 'Final deadline', v, T) +
          '<p class="form-error" id="dl-error" hidden></p>' +
          '<div class="modal-actions">' + (p.deadline ? '<button type="button" class="btn btn-quiet" data-act="remove" style="margin-right:auto">Remove deadline</button>' : '') +
          '<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save deadline</button></div></form>';
        whenWire('dl');
      },
      onClick: function (e) {

  function openReopen(pid) {

  function openBackup() {
    var T = todayISO();
    var where = mode === 'artifact' ? 'inside this page, so it’s there whenever you open the link'
      : mode === 'readonly' ? 'by the page owner' : (mode === 'github' && gh) ? 'in GitHub (' + esc(gh.repo) + ', ' + esc(gh.path) + ') and in this browser' : 'in this browser only';
    openModal({
      draw: function () {
        var json = JSON.stringify(state, null, 2);
        $('#modal-body').innerHTML = '<h2 id="modal-title">Backup</h2>' +
          '<p>Your board is saved ' + where + '. Copy this to keep a backup, or to move your board into another copy of this dashboard.</p>' +
          '<label for="bk-out" class="sr-only">Backup data</label><textarea id="bk-out" rows="7" readonly style="font:12px/1.4 var(--font-mono)">' + esc(json) + '</textarea>' +
          '<div class="modal-actions" style="justify-content:flex-start"><button type="button" class="btn" data-act="copy">Copy backup</button>' +
          (!inViewer ? '<button type="button" class="btn" data-act="download">Download .json</button>' : '') +
          '<span class="muted" id="bk-msg" style="align-self:center;font-size:13px"></span></div>' +
          (mode !== 'readonly' ? '<h3>Restore</h3><p class="muted" style="font-size:13px">This replaces everything on the board.</p>' +
            '<div class="field"><label for="bk-file">From a .json file</label><input type="file" id="bk-file" accept=".json,application/json"></div>' +
            '<div class="field"><label for="bk-in">Or paste a backup</label><textarea id="bk-in" rows="3" style="font:12px/1.4 var(--font-mono)"></textarea></div>' +
            '<p class="form-error" id="bk-error" hidden></p>' +
            '<div class="modal-actions"><button type="button" class="btn" data-close>Close</button><button type="button" class="btn danger" data-act="restore">Replace board with backup</button></div>'
            : '<div class="modal-actions"><button type="button" class="btn" data-close>Close</button></div>');
      },
      onClick: function (e) {
        var b = e.target.closest('[data-act]'); if (!b) return;
        var msg = $('#bk-msg');
        if (b.dataset.act === 'copy') {
          var txt = $('#bk-out').value;
          try {
            navigator.clipboard.writeText(txt).then(function () { msg.textContent = 'Copied.'; }, function () { $('#bk-out').select(); msg.textContent = 'Selected. Press Ctrl/⌘ + C to copy.'; });
          } catch (er) { $('#bk-out').select(); msg.textContent = 'Selected. Press Ctrl/⌘ + C to copy.'; }
        } else if (b.dataset.act === 'download') {
          try {
            var blob = new Blob([$('#bk-out').value], { type: 'application/json' });
            var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'polaris-' + T + '.json';
            document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
          } catch (er) { msg.textContent = 'Download isn’t available here. Use Copy instead.'; }
        } else if (b.dataset.act === 'restore') {
          var err = $('#bk-error'), raw = $('#bk-in').value.trim();
          var doRestore = function (text) {
            var parsed = null; try { parsed = normalize(JSON.parse(text)); } catch (er) { parsed = null; }
            if (!parsed) { err.textContent = 'That doesn’t look like a backup from this dashboard.'; err.hidden = false; return; }
            var rev = state.rev;
            commit(function () { state = parsed; state.rev = rev; });
            closeModal();
          };
          var file = $('#bk-file').files && $('#bk-file').files[0];
          if (raw) doRestore(raw);
          else if (file) { var fr = new FileReader(); fr.onload = function () { doRestore(String(fr.result || '')); }; fr.readAsText(file); }
          else { err.textContent = 'Choose a file or paste a backup first.'; err.hidden = false; }
        }
      }
    });
  }

  function laneDay(lane, clientX) {
    var board = $('#board'), days = +board.dataset.days, r = lane.getBoundingClientRect();
    var i = Math.floor((clientX - r.left) / r.width * days);
    i = Math.max(0, Math.min(days - 1, i));
    return { i: i, date: addDays(board.dataset.start, i), days: days };
  }

  function mount() {

    window.addEventListener('hashchange', function () { hideTip(); render(); });

    // header

    title.addEventListener('keydown', function (e) { if (e.key === 'Enter') title.blur(); if (e.key === 'Escape') { title.value = state.title; title.blur(); } });
    title.addEventListener('change', function () {
      var v = title.value.trim() || 'Polaris';
      if (v !== state.title) commit(function (s) { s.title = v.slice(0, 40); });
      else title.value = state.title;

      var open = moreMenu.hidden;
      moreMenu.hidden = !open; moreBtn.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function (e) { if (!moreMenu.hidden && !e.target.closest('#more-menu')) closeMenu(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !moreMenu.hidden) closeMenu(); });
    $('#mm-backup').addEventListener('click', function () { closeMenu(); openBackup(); });
    $('#mm-library').addEventListener('click', function () { closeMenu(); location.hash = '#library'; });
    $('#mm-review').addEventListener('click', function () { closeMenu(); openReview(); });
    $('#mm-parking').addEventListener('click', function () { closeMenu(); openParking(); });

    // re-draw when the window crosses between phone and laptop layouts
    if (window.matchMedia) {
      var mq = window.matchMedia('(max-width: 640px)');
      var onMq = function () { lastScrollKey = null; render(); };
      if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq);
    }
    $('#btn-clear-sample').addEventListener('click', function () {
      commit(function (s) {
        var ids = {}; s.projects.forEach(function (p) { if (p.sample) ids[p.id] = true; });
        s.projects = s.projects.filter(function (p) { return !ids[p.id]; });
        s.updates = s.updates.filter(function (u) { return !ids[u.projectId]; });
      });
    });
    $('#btn-keep-sample').addEventListener('click', function () {
      commit(function (s) { s.projects.forEach(function (p) { p.sample = false; }); });
    });

    $('#reminders').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var a = b.dataset.act;
      if (a === 'deadline') openDeadline(b.dataset.pid);
      else if (a === 'end') openEnd(b.dataset.pid);
      else if (a === 'reopen') openReopen(b.dataset.pid);
      else if (a === 'milestone') openMilestone(b.dataset.pid, b.dataset.mid);
      else if (a === 'ms-done') {
        var pp = getProject(b.dataset.pid);
        var mm = pp && taskById(pp, b.dataset.mid);
        if (mm) commit(function (s) { setTaskDone(s, pp, mm, true, todayISO()); });
      }
      else if (a === 'wait-done' || a === 'wait-later') {
        var wp = getProject(b.dataset.pid), wm = wp && taskById(wp, b.dataset.mid), td = todayISO();
        if (wm) commit(function (s) { if (a === 'wait-done') setTaskDone(s, wp, wm, true, td); else wm.waitSince = td; });
      }
      else if (a === 'log-project') {
        $('#qa-project').value = b.dataset.pid;
        var qt = $('#qa-text'); qt.focus();
        try { qt.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (er) {}
      }
      else if (a === 'more-reminders') { ui.allReminders = !ui.allReminders; render(); }
      else if (a === 'gc-signin') gcalSignIn('');
      else if (a === 'review') openReview();
      else if (a === 'park-pick') openParking();
      else if (a === 'dismiss') {
        dismissed[b.dataset.key] = true;
        try { localStorage.setItem(LS_KEY + ':dismissed', JSON.stringify(dismissed)); } catch (er) {}
        render();
      }
    });

    $('#area-chips').addEventListener('click', function (e) {
      var b = e.target.closest('[data-area]'); if (!b) return;
      ui.area = b.dataset.area; render();
    });

    // quick add
    $('#quick-add').addEventListener('submit', function (e) {
      e.preventDefault();
      var T = todayISO(), err = $('#qa-error');
      var pid = $('#qa-project').value, d = $('#qa-date').value || T, txt = $('#qa-text').value.trim();
      err.hidden = true;
      if (!pid) { openNewProject(); return; }
      if (!txt) { $('#qa-text').focus(); return; }
      if (!isISO(d) || d > T) { err.textContent = 'Pick today or an earlier day.'; err.hidden = false; return; }
      $('#qa-text').value = '';
      $('#qa-date').value = T;
      addUpdate(pid, d, txt);
    });

    // to-do view
    $('#todo-add').addEventListener('submit', function (e) {
      e.preventDefault();
      if (mode === 'readonly') return;
      var T = todayISO(), inp = $('#td-text'), x = splitTaskInput(inp.value), pid = $('#td-project').value, p = pid ? getProject(pid) : null;
      if (!x.title) { inp.focus(); return; }
      var w = readWhen(inp, x.title); if (w) x.title = w.title;
      inp.value = ''; delete inp.dataset.nowhen;
      commit(function (s) {
        if (p) {
          var np = newPiece(x.title); np.url = x.url;
          if (w) { var v = moment(w.date, w.time, ''); np.date = v.date; np.time = v.time; np.at = v.at; np.tz = v.tz; } else np.today = T;
          p.milestones.push(np);
        }
        else s.tasks.push({ id: uid(), title: x.title, url: x.url, day: w ? w.date : T, created: Date.now(), done: false, doneOn: null, doneAt: 0, time: w && w.time ? w.time : null });
      });
      whenWatch('#td-text', '#td-when');
      inp.focus();
    });
    $('#view-todo').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var a = b.dataset.act, T = todayISO(), ro = mode === 'readonly';
      var p = b.dataset.pid ? getProject(b.dataset.pid) : null, m = p && b.dataset.mid ? taskById(p, b.dataset.mid) : null, t = null;
      if (b.dataset.tid) state.tasks.forEach(function (x) { if (x.id === b.dataset.tid) t = x; });
      if (a === 'td-toggle' && !ro) {
        if (t) { if (!t.done) starPop(t.id); commit(function () { t.done = !t.done; t.doneOn = t.done ? T : null; t.doneAt = t.done ? Date.now() : 0; if (!t.done) t.day = T; }); }
        else if (m) { if (!m.done) starPop(m.id); commit(function (s) { setTaskDone(s, p, m, !m.done, T); m.today = m.done ? null : T; }); }
      }
      else if (a === 'td-later' && !ro) {
        var tm = addDays(T, 1);
        if (t) commit(function () { t.day = tm; });
        else if (m) commit(function () { if (m.date && m.date <= T) { m.date = tm; m.today = null; } else m.today = tm; });
      }
      else if (a === 'td-pull' && m && !ro) commit(function () { m.today = T; });
      else if (a === 'td-ms' && m) openMilestone(p.id, m.id);
      else if (a === 'td-quick' && t) openQuickTask(t.id);
      else if (a === 'td-hub' && p) openHub(p.id, b.dataset.focus || null);
      else if (a === 'td-done-toggle') { todoShowDone = !todoShowDone; render(); }
    });

    // timeline toolbar
    $('#btn-prev').addEventListener('click', function () { ui.offset += 7; render(); });
    $('#btn-next').addEventListener('click', function () { ui.offset -= 7; render(); });
    $('#btn-today').addEventListener('click', function () { ui.offset = 0; render(); });

    // board
    var board = $('#board');
    board.addEventListener('mousemove', function (e) {
      var lane = e.target.closest('.lane');
      clearHover();
      if (!lane || e.target.closest('.node')) return;
      var p = getProject(lane.dataset.pid); if (!p) return;
      var info = laneDay(lane, e.clientX), T = todayISO();
      var col = $$('#board .col')[info.i]; if (col) col.classList.add('is-hover');
      var hasNode = !!lane.querySelector('.node[data-date="' + info.date + '"]');
      if (!hasNode && canAddOn(p, info.date, T)) {
        var g = lane.querySelector('.ghost');
        g.style.left = ((info.i + 0.5) * 100 / info.days) + '%';
        g.classList.add('show');
        lane.classList.add('can-add');
      }
    });
    board.addEventListener('mouseleave', clearHover);
    board.addEventListener('click', function (e) {
      var act = e.target.closest('[data-act]');
      if (act) {
        var pid = act.dataset.pid;
        if (act.dataset.act === 'end') openEnd(pid);
        else if (act.dataset.act === 'reopen') openReopen(pid);
        else if (act.dataset.act === 'delete-now') deleteNow(pid);
        else if (act.dataset.act === 'deadline') openDeadline(pid);
        else if (act.dataset.act === 'park') parkProject(pid, true);
        else if (act.dataset.act === 'unpark') parkProject(pid, false);
        else if (act.dataset.act === 'project') openHub(pid);
        else if (act.dataset.act === 'files') openHub(pid, 'files');
        else if (act.dataset.act === 'milestone') openMilestone(pid, act.dataset.mid);
        else if (act.dataset.act === 'new-project') openNewProject();
        else if (act.dataset.act === 'sync') openSync();
        return;
      }
      var node = e.target.closest('.node');
      if (node) { hideTip(); openDay(node.dataset.pid, node.dataset.date); return; }
      var lane = e.target.closest('.lane');
      if (lane) {
        var p = getProject(lane.dataset.pid); if (!p) return;
        var info = laneDay(lane, e.clientX);
        if (canAddOn(p, info.date, todayISO())) openDay(p.id, info.date);
      }
    });
    board.addEventListener('pointerover', function (e) { if (e.pointerType !== 'mouse') return; var n = e.target.closest('.node'); if (n) showTip(n); });
    board.addEventListener('pointerout', function (e) { if (e.target.closest('.node')) hideTip(); });
    board.addEventListener('focusin', function (e) { var n = e.target.closest('.node'); if (n && n.matches(':focus-visible')) showTip(n); });
    board.addEventListener('focusout', hideTip);
    $('#tl-scroll').addEventListener('scroll', hideTip, { passive: true });
    window.addEventListener('scroll', hideTip, { passive: true });

    // table view
    var tv = $('#view-table');
    $('#f-archived').addEventListener('change', function (e) { ui.showArchived = e.target.checked; render(); });
    $('#f-project').addEventListener('change', function (e) { ui.filterProject = e.target.value; render(); });
    $('#f-search').addEventListener('input', function (e) { ui.search = e.target.value; render(); });
    tv.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var pid = b.dataset.pid, id = b.dataset.id, p = pid ? getProject(pid) : null;
      switch (b.dataset.act) {
        case 'color': commit(function () { p.color = (p.color + 1) % INKS; }); break;
        case 'rename':
          if (mode === 'readonly') return;
          ui.editingProject = pid; render();
          var inp = $('#pn-input'); if (inp) { inp.focus(); inp.select(); }
          break;
        case 'end': openEnd(pid); break;
        case 'reopen': openReopen(pid); break;
        case 'deadline': openDeadline(pid); break;
        case 'project': openHub(pid); break;
        case 'areas': openAreas(); break;
        case 'files': openHub(pid, 'files'); break;
        case 'link': openLink(pid, b.dataset.lid); break;
        case 'delete-project':
          var n = countFor(pid);
          confirmDialog({
            title: 'Delete “' + p.name + '”?', yes: 'Delete project', danger: true,
            body: 'This removes the project and its ' + plural(n, 'update') + ' for good. To keep the history, use <b>End</b> instead.',
            onYes: function () { commit(function (s) { s.projects = s.projects.filter(function (x) { return x.id !== pid; }); s.updates = s.updates.filter(function (u) { return u.projectId !== pid; }); }); }
          });
          break;
        case 'edit-upd': ui.editingUpdate = id; render(); var t = $('#ue-text'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } break;
        case 'cancel-upd': ui.editingUpdate = null; render(); break;
        case 'save-upd': saveTableUpdate(id); break;
        case 'del-upd':
          var u = null; state.updates.forEach(function (x) { if (x.id === id) u = x; });
          if (!u) return;
          confirmDialog({
            title: 'Delete this update?', yes: 'Delete update', danger: true,
            body: '“' + esc(truncate(u.text, 140)) + '” from ' + fmtLong(u.date) + '.',
            onYes: function () { commit(function (s) { s.updates = s.updates.filter(function (x) { return x.id !== id; }); }); }
          });
          break;
      }
    });
    var renameDone = false;
    tv.addEventListener('keydown', function (e) {
      if (e.target.id === 'pn-input') {
        if (e.key === 'Enter') { e.preventDefault(); finishRename(true); }
        if (e.key === 'Escape') { e.preventDefault(); finishRename(false); }
      }
      if (e.target.id === 'ue-text' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveTableUpdate(ui.editingUpdate); }
      if ((e.target.id === 'ue-text' || e.target.id === 'ue-date' || e.target.id === 'ue-project') && e.key === 'Escape') { ui.editingUpdate = null; render(); }
    });
    tv.addEventListener('focusout', function (e) { if (e.target.id === 'pn-input') setTimeout(function () { finishRename(true); }, 0); });
    function finishRename(save) {
      if (!ui.editingProject || renameDone) return;
      renameDone = true;
      var inp = $('#pn-input'), pid = ui.editingProject, v = inp ? inp.value.trim() : '';
      ui.editingProject = null;
      var p = getProject(pid);
      if (save && p && v && v !== p.name) commit(function () { p.name = v.slice(0, 80); });
      else { render(); if (dirty) scheduleSave(); }
      renameDone = false;
    }
    function saveTableUpdate(id) {
      var T = todayISO(), d = $('#ue-date').value, pid = $('#ue-project').value, v = $('#ue-text').value.trim(), err = $('#ue-error');
      var p = getProject(pid);
      var fail = function (m) { err.textContent = m; err.hidden = false; };
      if (!v) return fail('The update can’t be empty.');
      if (!isISO(d) || d > T) return fail('Pick today or an earlier day.');
      if (p && p.ended && d > p.ended) return fail('That’s after this project ended (' + fmtShort(p.ended) + '). Reopen it first.');
      ui.editingUpdate = null;
      commit(function (s) {
        s.updates.forEach(function (u) { if (u.id === id) { u.date = d; u.projectId = pid; u.text = v; } });
        if (p && d < p.start) p.start = d;
      });
    }

    // project window
    var hub = $('#hub');
    hub.addEventListener('mousedown', function (e) { hubDownOnBackdrop = e.target === hub; });
    hub.addEventListener('click', function (e) {
      if (e.target === hub) { if (hubDownOnBackdrop) closeHub(); return; }
      var b = e.target.closest('[data-act]'); if (!b) return;
      var pid = ui.hub, p = getProject(pid); if (!p) return;
      var a = b.dataset.act;
      if (a === 'hub-close') closeHub();
      else if (a === 'hub-edit') openProject(pid);
      else if (a === 'scoring') openScoring(pid);
      else if (a === 'park') parkProject(pid, true);
      else if (a === 'unpark') parkProject(pid, false);
      else if (a === 'end') openEnd(pid);
      else if (a === 'reopen') openReopen(pid);
      else if (a === 'delete-now') deleteNow(pid);
      else if (a === 'deadline') openDeadline(pid);
      else if (a === 'task-toggle') {
        var m = taskById(p, b.dataset.mid);
        if (m && mode !== 'readonly') { if (!m.done) starPop(m.id); commit(function (s) { setTaskDone(s, p, m, !m.done, todayISO()); }); }
      }
      else if (a === 'task') openMilestone(pid, b.dataset.mid);
      else if (a === 'task-today') {
        var mt = taskById(p, b.dataset.mid), td0 = todayISO();
        if (mt && mode !== 'readonly') commit(function () { mt.today = mt.today && mt.today <= td0 ? null : td0; });
      }
      else if (a === 'link') openLink(pid, b.dataset.lid);
      else if (a === 'open-day') openDay(pid, b.dataset.date);
      else if (a === 'hub-done') { ui.hubShowDone = !ui.hubShowDone; renderHub(); }
      else if (a === 'hub-all') { ui.hubAllTasks = !ui.hubAllTasks; renderHub(); }
      else if (a === 'hub-log') { ui.hubAllLog = !ui.hubAllLog; renderHub(); }
      else if (a === 'hub-th-note') { var hn = b.dataset.id; closeHub(); ui.thPage = hn; try { localStorage.setItem(TH_PAGE_KEY, hn); } catch (e) {} if (currentView() === 'thesis') { thOpen(hn, true); return; }
        var toR = function () { location.hash = '#research'; };
        if (backN) window.addEventListener('popstate', function once() { window.removeEventListener('popstate', once); setTimeout(toR, 0); }); else toR(); }
    });
    hub.addEventListener('submit', function (e) {
      e.preventDefault();
      var p = getProject(ui.hub); if (!p || mode === 'readonly') return;
      var T = todayISO(), id = e.target.id;
      if (id === 'task-add') {
        var ti = $('#ta-title'), x = splitTaskInput(ti.value), dt = $('#ta-date').value;
        if (!x.title) { ti.focus(); return; }
        var w = readWhen(ti, x.title); if (w) x.title = w.title;
        ti.value = ''; $('#ta-date').value = ''; delete ti.dataset.nowhen;
        commit(function () {
          var np = newPiece(x.title), v = moment(isISO(dt) ? dt : w ? w.date : null, w ? w.time : null, '');
          np.date = v.date; np.time = v.time; np.at = v.at; np.tz = v.tz; np.url = x.url; p.milestones.push(np);
        });
        var t2 = $('#ta-title'); if (t2) t2.focus();
      } else if (id === 'hub-lk') {
        var raw = $('#hl-url').value, url = cleanUrl(raw), err = $('#hl-error');
        if (!url) {
          err.textContent = raw.trim() ? 'That doesn’t look like a web link. Copy the whole address from the browser bar or the Share button.' : 'Paste a link first.';
          err.hidden = false; $('#hl-url').focus(); return;
        }
        var name = $('#hl-name').value.trim().slice(0, 120);
        $('#hl-url').value = ''; $('#hl-name').value = '';
        commit(function () { linksOf(p).push({ id: uid(), url: url, title: name, kind: guessKind(url), notes: '', added: T }); });
        var u2 = $('#hl-url'); if (u2) u2.focus();
      } else if (id === 'log-add') {
        var ta = $('#lg-text'), v = ta.value.trim();
        if (!v) { ta.focus(); return; }
        ta.value = '';
        var lp = $('#lg-piece'), pc = lp && lp.value && taskById(p, lp.value) ? lp.value : '';
        if (lp) lp.value = '';
        addUpdate(p.id, T, v, pc);
        var l2 = $('#lg-text'); if (l2) l2.focus();
      }
    });
    hub.addEventListener('change', function (e) {
      if (e.target.id === 'hub-notes') { saveHubNotes(); return; }
      if (e.target.matches && e.target.matches('select[data-act="piece-status"]')) {
        var p = getProject(ui.hub), m = p && taskById(p, e.target.dataset.mid), v = e.target.value;
        if (!m || mode === 'readonly') return;
        if (v === 'done' && !m.done) starPop(m.id);
        commit(function (s) { setStatus2(s, p, m, v, todayISO()); });
      }
    });
    hub.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.id === 'lg-text') {
        e.preventDefault();
        var f = $('#log-add'); if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      }
    });

    // modal
    var modal = $('#modal');
    modal.addEventListener('click', function (e) {
      if (e.target === modal || e.target.closest('[data-close]')) { closeModal(); return; }
      if (modalCtx && modalCtx.onClick) modalCtx.onClick(e);
    });
    modal.addEventListener('submit', function (e) { e.preventDefault(); if (modalCtx && modalCtx.onSubmit) modalCtx.onSubmit(e); });
    modal.addEventListener('input', function (e) { if (modalCtx && modalCtx.onInput) modalCtx.onInput(e); });
    modal.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.tagName === 'TEXTAREA') {
        e.preventDefault();
        if (modalCtx && modalCtx.onCtrlEnter && e.target.id === 'edit-text') { modalCtx.onCtrlEnter(e.target); return; }
        var f = e.target.closest('form'); if (f) { if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true })); }
      }
    });

    // global keys
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
      if (e.key === 'Escape' && ui.hub) { closeHub(); return; }
      var tag = (document.activeElement && document.activeElement.tagName) || '';
      if (e.key === '/' && $('#modal').hidden && !ui.hub && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag) && mode !== 'readonly') {
        e.preventDefault(); (currentView() === 'todo' ? $('#td-text') : $('#qa-text')).focus();
      }
    });
    $('#qa-text').addEventListener('blur', function () { if (dirty) scheduleSave(); });

    // save if the tab is being hidden with unsaved work
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { if (dirty) trySave(true); return; }
      if (dirty) { trySave(true); return; }   // changes made while offline go up as soon as you're back
      if (mode === 'github' && !publishing && $('#modal').hidden && !ui.editingUpdate && !ui.editingProject) ghPull();
    });
    window.addEventListener('online', function () {
      if (dirty) trySave(true);
      else if (mode === 'github' && !publishing && $('#modal').hidden) ghPull();
    });

    // day rollover
    setInterval(function () {
      var t = todayISO();
      if (t !== lastToday) { var d = $('#qa-date'); if (d && d.value === lastToday) d.value = t; lastToday = t; if ($('#modal').hidden) render(); }
    }, 60000);
  }

  /* ================= boot ================= */
  function start(data) {
    data = data || {};
    var s = loadEmbedded();
    if (!inViewer) { var l = loadLocal(); if (l && (!s || l.rev >= s.rev)) s = l; }
    var pending = data.pending ? normalize(data.pending) : null;
    if (pending && (!s || pending.rev > s.rev)) { s = pending; dirty = true; }
    state = s || normalize(sampleState());
    try {
      var dm = JSON.parse(localStorage.getItem(LS_KEY + ':dismissed') || '{}') || {}, today = todayISO();
      Object.keys(dm).forEach(function (k) { var kd = k.slice(-10); if (isISO(kd) && Math.abs(diffDays(kd, today)) <= 7) dismissed[k] = true; });
    } catch (e) {}
    if (data.ui) {
      if ([7, 14, 30].indexOf(data.ui.range) !== -1) ui.range = data.ui.range;
      if (typeof data.ui.offset === 'number' && data.ui.offset >= 0) ui.offset = data.ui.offset;
      ui.showArchived = !!data.ui.showArchived;
      if (typeof data.ui.filterProject === 'string') ui.filterProject = data.ui.filterProject;
      if (typeof data.ui.search === 'string') ui.search = data.ui.search;
    }
    if (!(data.ui && data.ui.range) && isPhone()) ui.range = 7;
    mount();
    if (data.qa) {
      if (typeof data.qa.project === 'string') $('#qa-project').dataset.want = data.qa.project;
      if (typeof data.qa.text === 'string') $('#qa-text').value = data.qa.text;
    }
    render();
    if (hot && typeof hot.snapshot === 'function') {
      try {
        hot.snapshot(function () {
          return {
            ui: { range: ui.range, offset: ui.offset, showArchived: ui.showArchived, filterProject: ui.filterProject, search: ui.search },
            qa: { project: $('#qa-project').value, text: $('#qa-text').value },
            pending: (dirty || publishing) ? state : null
          };
        });
      } catch (e) {}
    }
    initStorage();
    gcalBoot();
    initDrag();
    initCompass();
    initThesis();
    try { localStorage.removeItem('polaris:ai'); sessionStorage.removeItem('polaris:chat'); } catch (e) {}   // AI was removed: forget any saved key
    // offline copy for the installed app (needs sw.js next to index.html; harmless without it)
    if ('serviceWorker' in navigator && !inViewer && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude|anthropic/.test(location.hostname))
      navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
