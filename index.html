<title>Polaris</title>
<style id="app-style">
:root{
  /* Layout: a deep-space board. Each project is a trajectory across a day grid, updates are glowing planets, an ended trajectory stops at a red ✕ and drifts to the bottom. One dark theme on purpose. */
  --space:#0a0d16;
  --panel:#111624;
  --panel-2:#171d2f;
  --ink:#e7eaf3;
  --muted:#8a92a8;
  --rule:#232a3e;
  --accent:#8ab4ff;
  --stop:#ff6b5e;
  --ok:#6fd6a0;
  --warn:#ffb86b;
  --tint-today:rgba(138,180,255,.09);
  --tint-hover:rgba(138,180,255,.05);
  --tint-wknd:rgba(255,255,255,.018);
  --c0:#8ab4ff; --c1:#5fd4c4; --c2:#b79cff; --c3:#ffb86b; --c4:#9be07a; --c5:#ff86b3;
  --font-display:"Unbounded","Geist",system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  --font-body:"Geist",system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"PingFang TC","Noto Sans TC",monospace;
  --label-w:252px;
  --lane-h:54px;
  --axis-h:48px;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--space);
  background-image:
    radial-gradient(ellipse 55% 45% at 88% -5%, rgba(88,112,210,.20), transparent 70%),
    radial-gradient(ellipse 45% 40% at -5% 105%, rgba(150,92,210,.13), transparent 70%),
    radial-gradient(circle at 17px 43px, rgba(255,255,255,.75) 0 1px, transparent 1.6px),
    radial-gradient(circle at 121px 9px, rgba(255,255,255,.45) 0 .8px, transparent 1.4px),
    radial-gradient(circle at 189px 151px, rgba(200,215,255,.6) 0 1px, transparent 1.6px),
    radial-gradient(circle at 58px 211px, rgba(255,255,255,.5) 0 .8px, transparent 1.4px),
    radial-gradient(circle at 263px 97px, rgba(255,255,255,.7) 0 1px, transparent 1.6px),
    radial-gradient(circle at 331px 277px, rgba(210,220,255,.45) 0 .8px, transparent 1.4px),
    radial-gradient(circle at 140px 380px, rgba(255,226,180,.85) 0 1.3px, transparent 2.2px),
    radial-gradient(circle at 470px 120px, rgba(190,210,255,.9) 0 1.3px, transparent 2.2px);
  background-size:100% 100%,100% 100%,233px 197px,233px 197px,233px 197px,389px 311px,389px 311px,389px 311px,547px 463px,547px 463px;
  background-repeat:no-repeat,no-repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat;
  background-attachment:fixed;
  color:var(--ink);
  font:15px/1.5 var(--font-body);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}

.wrap{max-width:1320px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) max(clamp(16px,3vw,40px), env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(clamp(16px,3vw,40px), env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;flex:none;color:var(--accent)}
.logo{filter:drop-shadow(0 0 7px rgba(138,180,255,.65))}
.logo path{fill:currentColor}
.logo .core{fill:#fff}
.brand input.board-title{
  font-family:var(--font-display);font-weight:600;font-size:27px;line-height:1.15;letter-spacing:.01em;
  border:0;border-bottom:1px dashed transparent;border-radius:0;background:transparent;padding:0 2px;margin:0;
  width:auto;field-sizing:content;min-width:3ch;max-width:16ch;color:var(--ink);
}
.brand input.board-title:hover{border-bottom-color:var(--rule)}
.brand input.board-title:focus{outline:none;border-bottom-color:var(--accent)}
.today-stamp{font:500 13px var(--font-mono);color:var(--muted);white-space:nowrap}
.views{display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--rule);border-radius:999px}
.view-tab{font-weight:500;font-size:14px;text-decoration:none;color:var(--muted);padding:5px 15px;border-radius:999px}
.view-tab:hover{color:var(--ink)}
.view-tab[aria-current="page"]{color:var(--ink);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--rule)}
.top-actions{position:relative;margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.save-status{font:500 12px var(--font-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.save-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.save-status:empty{display:none}
.save-status.is-ok{color:var(--ok)}
.save-status.is-saving{color:var(--muted)}
.save-status.is-warn{color:var(--warn)}
.save-status.is-err{color:var(--stop)}
.save-status button{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}

/* ---------- buttons & fields ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-weight:500;font-size:14px;line-height:1.2;
  padding:8px 14px;border:1px solid var(--rule);border-radius:8px;
  background:var(--panel);color:var(--ink);cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.btn:hover{background:var(--panel-2);border-color:#38415a}
.btn:disabled{opacity:.4;cursor:default;background:var(--panel);border-color:var(--rule)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0a0d16;font-weight:600}
.btn.primary:hover{background:#a8c7ff;border-color:#a8c7ff}
.btn.danger{background:var(--stop);border-color:var(--stop);color:#1b0b09;font-weight:600}
.btn.danger:hover{background:#ff877c;border-color:#ff877c}
.btn-sm{font-size:12px;padding:4px 10px}
.btn-quiet{background:transparent;color:var(--muted)}
.link-btn{background:none;border:0;padding:2px 4px;color:var(--accent);font-size:13px;cursor:pointer}
.link-btn:hover{text-decoration:underline;text-underline-offset:3px}
.link-btn.danger{color:var(--stop)}

input[type="text"],input[type="date"],input[type="search"],input:not([type]),select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--panel-2);color:var(--ink);
}
input::placeholder,textarea::placeholder{color:#5f6780}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
label{font-size:13px;font-weight:500;color:var(--muted)}

/* ---------- sample banner ---------- */
.sample-banner{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;
  padding:9px 14px;border:1px solid rgba(138,180,255,.3);border-radius:10px;background:rgba(138,180,255,.06);font-size:14px;
}
.sample-banner strong{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--accent)}

/* ---------- quick add ---------- */
.quick-add{
  display:grid;grid-template-columns:minmax(150px,230px) 158px 1fr auto;gap:8px;align-items:center;
  padding:10px;background:rgba(17,22,36,.85);border:1px solid var(--rule);border-radius:12px;
}
.quick-add .qa-error{grid-column:1/-1;margin:0;color:var(--stop);font-size:13px}
.kbd{font:500 11px var(--font-mono);border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--muted)}

/* ---------- timeline ---------- */
.tl-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--rule);border-radius:999px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.tl-nav{display:inline-flex;gap:6px}
.range-label{font:500 13px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}

.tl-scroll{overflow-x:auto;padding:4px 0 2px}
.board{position:relative;padding-top:6px}
.cols{
  position:absolute;top:0;bottom:var(--axis-h);left:var(--label-w);right:0;
  display:grid;grid-template-columns:repeat(var(--days),1fr);pointer-events:none;
}
.col.is-wknd{background:var(--tint-wknd)}
.col.is-today{background:linear-gradient(180deg,rgba(138,180,255,.04),var(--tint-today));border-radius:6px 6px 0 0}
.col.is-hover{background:var(--tint-hover)}
.col.is-today.is-hover{background:var(--tint-today)}

.row{position:relative;display:grid;grid-template-columns:var(--label-w) 1fr;min-height:var(--lane-h)}
.label{
  position:sticky;left:0;z-index:3;display:flex;align-items:center;gap:8px;
  padding:5px 14px 5px 0;background:linear-gradient(90deg,var(--space) 92%,transparent);
}
.label-box{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;
  padding:6px 10px 7px;background:var(--panel);
  border:1px solid var(--rule);border-left:3px solid var(--pc);border-radius:8px;
}
.label-name{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.label-meta{font:400 11.5px/1.35 var(--font-mono);color:var(--muted)}
.row.ended .label-box{border-left-color:var(--muted);background:transparent}
.row.ended .label-name{color:var(--muted)}

.lane{position:relative;min-height:var(--lane-h)}
.lane.can-add{cursor:pointer}
.line{
  position:absolute;top:50%;height:2px;margin-top:-1px;border-radius:2px;
  background:var(--pc);opacity:.7;box-shadow:0 0 8px var(--pc);pointer-events:none;
}
.line.runs-left{-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px);mask-image:linear-gradient(90deg,transparent,#000 26px)}
.line.runs-right{-webkit-mask-image:linear-gradient(270deg,transparent,#000 36px);mask-image:linear-gradient(270deg,transparent,#000 36px)}
.line.runs-left.runs-right{-webkit-mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 26px,#000 calc(100% - 36px),transparent)}
.row.ended .line{background:var(--muted);opacity:.45;box-shadow:none}

.node{
  position:absolute;top:50%;z-index:2;width:14px;height:14px;padding:0;margin:0;
  transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
  background:var(--pc);border:2px solid var(--space);box-shadow:0 0 0 1px var(--pc),0 0 12px var(--pc);
  display:grid;place-items:center;color:var(--space);font:600 10px/1 var(--font-mono);
  transition:transform .12s ease;
}
.node.multi{width:20px;height:20px}
.node:hover,.node:focus-visible{transform:translate(-50%,-50%) scale(1.25)}
.row.ended .node{background:var(--muted);box-shadow:0 0 0 1px var(--muted)}
.node.just-added{animation:pop .7s ease}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2)}55%{transform:translate(-50%,-50%) scale(1.45)}100%{transform:translate(-50%,-50%) scale(1)}}
.ghost{
  position:absolute;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);
  border:1px dashed var(--pc);border-radius:50%;color:var(--pc);background:var(--space);
  display:grid;place-items:center;font:500 14px/1 var(--font-mono);pointer-events:none;opacity:0;
}
.ghost.show{opacity:1}
.xmark{position:absolute;top:50%;z-index:2;width:24px;height:24px;transform:translate(-50%,-50%);color:var(--stop);pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,107,94,.55))}
.xmark svg{width:100%;height:100%;display:block;overflow:visible}
.xmark path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

.divider{display:flex;align-items:center;gap:10px;padding:12px 0 2px;position:relative;z-index:3}
.divider span{position:sticky;left:0;font:500 12px var(--font-mono);color:var(--muted);background:var(--space);padding-right:8px;white-space:nowrap}
.divider::after{content:"";flex:1;border-top:1px dashed var(--rule)}

.empty{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:34px 4px;color:var(--muted);position:relative;z-index:3}
.empty p{margin:0;font-family:var(--font-display);font-weight:500;font-size:15px}

.axis-row{display:grid;grid-template-columns:var(--label-w) 1fr;height:var(--axis-h);margin-top:6px}
.axis-spacer{position:sticky;left:0;z-index:3;background:linear-gradient(90deg,var(--space) 92%,transparent)}
.axis{position:relative;display:grid;grid-template-columns:repeat(var(--days),1fr);border-top:1px solid rgba(231,234,243,.3)}
.tick{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:10px;line-height:1.15;min-width:0}
.tick::before{content:"";position:absolute;top:-1px;left:50%;width:1px;height:6px;background:rgba(231,234,243,.45)}
.tick-wd{font:500 9px/1.3 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tick-d{font:500 12px var(--font-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick.is-today .tick-wd{font-weight:700;color:var(--accent)}
.tick.is-today .tick-d{color:var(--accent)}
.tick.is-today::before{background:var(--accent);height:9px;box-shadow:0 0 6px var(--accent)}


/* ---------- tooltip ---------- */
.tooltip{
  position:fixed;z-index:60;max-width:320px;pointer-events:none;
  background:var(--panel-2);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;
  box-shadow:0 12px 32px rgba(0,0,0,.45);
}
.tooltip .tip-head{font:500 11px var(--font-mono);color:var(--muted);margin-bottom:5px}
.tooltip ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px}
.tooltip .tip-foot{margin-top:6px;font-size:11px;color:var(--muted)}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(4,6,12,.62);display:grid;place-items:center;padding:16px}
.modal{
  width:min(540px,100%);max-height:88vh;overflow:auto;
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  box-shadow:0 24px 64px rgba(0,0,0,.55);padding:20px 22px 18px;
}
.modal h2{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1.3;margin:0;text-wrap:balance}
.modal h3{font-size:14px;margin:18px 0 6px}
.modal p{margin:8px 0}
.modal-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.modal-head .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc);margin-top:11px}
.modal-sub{margin:2px 0 0 !important;font:500 13px var(--font-mono);color:var(--muted)}
.modal form{display:flex;flex-direction:column;gap:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:14px}
.form-error{color:var(--stop);font-size:13px;margin:4px 0 0}
.swatches{display:flex;gap:8px;flex-wrap:wrap;border:0;padding:0;margin:0}
.swatches legend{font-size:13px;font-weight:500;color:var(--muted);padding:0;margin-bottom:6px}
.swatch-opt{position:relative}
.swatch-opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.swatch-opt span{display:block;width:24px;height:24px;border-radius:50%;background:var(--pc);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--rule)}
.swatch-opt input:checked+span{box-shadow:0 0 0 2px var(--ink),0 0 10px var(--pc)}
.swatch-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}

.upd-list{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column}
.upd-list li{padding:10px 0;border-bottom:1px solid var(--rule)}
.upd-list li:first-child{border-top:1px solid var(--rule)}
.upd-text{white-space:pre-wrap;overflow-wrap:anywhere}
.upd-tools{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.upd-tools .time{font-family:var(--font-mono);margin-right:auto}

/* ---------- tables ---------- */
.view-table{display:flex;flex-direction:column;gap:10px}
.view-table h2{font-family:var(--font-display);font-weight:600;font-size:19px;margin:8px 0 0}
.table-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select{width:auto;min-width:170px}
.filters input[type="search"]{width:220px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent)}
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:rgba(17,22,36,.9)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11.5px var(--font-mono);letter-spacing:.02em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,td.date{font-family:var(--font-mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.text{min-width:260px;white-space:pre-wrap;overflow-wrap:anywhere}
td.actions{white-space:nowrap;text-align:right}
tr.is-archived td{color:var(--muted)}
.proj-cell{display:inline-flex;align-items:center;gap:8px}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--pc);box-shadow:0 0 6px var(--pc);flex:none}
.swatch-btn{width:16px;height:16px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--pc),0 0 8px var(--pc);background:var(--pc);cursor:pointer;padding:0;display:block}
.name-btn{background:none;border:0;padding:0;font-weight:600;cursor:text;text-align:left;overflow-wrap:anywhere}
.name-btn:hover{text-decoration:underline dotted;text-underline-offset:3px}
.cell-input{min-width:180px}
.pill{display:inline-block;font:500 11.5px var(--font-mono);padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.active{color:var(--ok)}
.pill.ended{color:var(--stop)}
.pill.archived{color:var(--muted);border-style:dashed}
.table-empty{padding:18px 12px;color:var(--muted)}
.count{font:500 12px var(--font-mono);color:var(--muted)}
tr.editing td{background:var(--tint-hover)}

.label-acts{display:flex;flex-direction:column;gap:4px}
.label-acts .btn{justify-content:center;min-width:44px}
.icon-btn{padding:3px 8px}
.icon-btn .flag{width:14px;height:14px}

/* deadlines */
.flag{display:block}
.flag path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.flag .fill{fill:currentColor;fill-opacity:.35;stroke:none}
.xico{display:block}
.xico path{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.line.plan{background:repeating-linear-gradient(90deg,var(--pc) 0 5px,transparent 5px 10px);opacity:.55;box-shadow:none}
.line.stub{opacity:.45;box-shadow:none}
.col.is-future{background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 6px,transparent 6px 12px)}
.tick.is-future .tick-wd,.tick.is-future .tick-d{opacity:.45}
.flag-mark{position:absolute;top:50%;z-index:2;width:22px;height:22px;padding:0;border:0;background:none;color:var(--pc);cursor:pointer;transform:translate(-22%,-88%)}
.flag-mark .flag{width:100%;height:100%}
.flag-mark.is-soon{color:var(--warn);filter:drop-shadow(0 0 5px rgba(255,184,107,.6))}
span.flag-mark{cursor:default}
.due-off{position:absolute;right:4px;top:50%;transform:translateY(-50%);z-index:2;font:500 11px var(--font-mono);color:var(--muted);background:var(--space);padding:1px 7px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap;pointer-events:none}
.due-off.is-soon{color:var(--warn);border-color:rgba(255,184,107,.45)}
.label-meta .due{display:inline-flex;align-items:center;gap:4px}
.label-meta .due .flag{width:11px;height:11px}
.label-meta .due.is-soon{color:var(--warn)}
.pill.due{color:var(--warn)}
.reminders{display:flex;flex-direction:column;gap:6px}
.reminder{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:9px 14px;border:1px solid rgba(255,184,107,.32);background:rgba(255,184,107,.06);border-radius:10px;font-size:14px}
.reminder.is-today{border-color:rgba(255,184,107,.7);background:rgba(255,184,107,.12)}
.reminder.is-forced{border-color:rgba(255,107,94,.35);background:rgba(255,107,94,.06)}
.reminder .msg{flex:1;min-width:220px}
.reminder .flag,.reminder .xico{width:16px;height:16px;flex:none}
.reminder .flag{color:var(--warn)}
.reminder .xico{color:var(--stop)}
.reminder-acts{display:flex;flex-wrap:wrap;gap:2px}

.is-readonly .edit-only{display:none !important}

/* icons */
.dia path,.star path{fill:currentColor}
.cal rect,.cal path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.check path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.orbit circle.p{fill:currentColor;stroke:none}
.orbit ellipse{fill:none;stroke:currentColor;stroke-width:1.5}

  background:radial-gradient(120% 160% at 0% 0%,rgba(138,180,255,.11),transparent 55%),rgba(17,22,36,.84)}
.week-stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:5px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--panel)}
.stat b{font:600 14px var(--font-mono);color:var(--ink)}
.stat .star{width:13px;height:13px;color:var(--accent)}
.stat em{font-style:normal;color:var(--warn)}
.stat.is-warn{border-color:rgba(255,184,107,.45)}
.stat.is-warn .star{color:var(--warn)}

/* week view */
.view-week{display:flex;flex-direction:column;gap:12px}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.day{display:flex;flex-direction:column;gap:8px;min-height:230px;padding:12px;border:1px solid var(--rule);border-radius:12px;background:rgba(17,22,36,.72)}
.day.is-today{border-color:rgba(138,180,255,.55);background:linear-gradient(180deg,rgba(138,180,255,.11),rgba(17,22,36,.84) 150px);box-shadow:0 0 0 1px rgba(138,180,255,.14),0 10px 30px rgba(0,0,0,.25)}
.day.is-past{background:rgba(17,22,36,.5)}
.day.is-future{background:rgba(17,22,36,.42);border-style:dashed}
.day-head{display:flex;align-items:baseline;gap:8px}
.day-rel{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.15;letter-spacing:-.005em}
.day.is-today .day-rel{color:var(--accent)}
.day-date{font:500 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.day-count{margin-left:auto;font:600 11px var(--font-mono);color:var(--space);background:var(--accent);border-radius:999px;padding:1px 7px}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.due-item,.log-item{width:100%;display:flex;align-items:flex-start;gap:8px;text-align:left;padding:7px 9px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px;line-height:1.35}
.due-item:hover,.log-item:hover{border-color:#38415a;background:var(--panel-2)}
.due-item svg{width:13px;height:13px;flex:none;margin-top:2px;color:var(--pc,var(--accent))}
.due-item.kind-ended svg{color:var(--stop)}
.due-item.is-soon{border-color:rgba(255,184,107,.55);background:rgba(255,184,107,.07)}
.due-item.is-soon svg{color:var(--warn)}
.due-item.is-done{opacity:.55}
.due-item.is-done .due-title{text-decoration:line-through}
.due-text{display:flex;flex-direction:column;min-width:0}
.due-title{font-weight:600;overflow-wrap:anywhere}
.due-kind{font:400 11px var(--font-mono);color:var(--muted)}
.log-item{flex-direction:column;gap:3px;border-left:3px solid var(--pc)}
.log-proj{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-mono);color:var(--muted)}
.log-proj .pdot{width:7px;height:7px}
.log-text{white-space:pre-wrap;overflow-wrap:anywhere}
.day-empty{margin:0;font-size:12.5px;color:#5f6780}
.day-add{margin-top:auto;align-self:flex-start;background:none;border:1px dashed var(--rule);border-radius:8px;color:var(--muted);font-size:12.5px;padding:5px 10px;cursor:pointer}
.day-add:hover{color:var(--ink);border-color:var(--muted)}
.week-divider{display:flex;align-items:center;gap:10px;font:500 12px var(--font-mono);color:var(--muted)}
.week-divider::after{content:"";flex:1;border-top:1px dashed var(--rule)}
@media (min-width: 641px) and (max-width: 1000px){
  .week{grid-template-columns:repeat(5,minmax(170px,1fr));overflow-x:auto;padding-bottom:4px}
}

/* areas */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:rgba(138,180,255,.12)}
.chip .n{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-left:5px}
.area-tag{display:inline-block;font:500 10px/1.5 var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
button.label-box{font:inherit;color:inherit;text-align:left;cursor:pointer}
button.label-box:hover{border-color:#38415a;border-left-color:var(--pc)}
.label-meta .drift{color:var(--warn)}
.row.drifting .line{opacity:.38}
.row.drifting .label-box{border-left-style:dashed}

/* milestones on the timeline */
.ms-mark{position:absolute;top:50%;z-index:2;width:13px;height:13px;padding:0;border:0;background:none;color:var(--pc);cursor:pointer;transform:translate(-50%,-150%)}
.ms-mark svg{width:100%;height:100%;display:block}
.ms-mark.is-soon{color:var(--warn);filter:drop-shadow(0 0 5px rgba(255,184,107,.6))}
.ms-mark.is-done{color:var(--muted);opacity:.55}
.ms-mark:hover{transform:translate(-50%,-150%) scale(1.25)}

/* reminder variants */
.reminder .dia,.reminder .star{width:14px;height:14px;flex:none;color:var(--warn)}
.reminder .orbit{width:18px;height:18px;flex:none;color:var(--warn)}
.reminder.is-recap{border-color:rgba(138,180,255,.35);background:rgba(138,180,255,.07)}
.reminder.is-recap .orbit{color:var(--accent)}
.reminders-more{align-self:flex-start;font-size:13px}

/* dialogs */
.field-label{font-size:13px;font-weight:500;color:var(--muted)}
.ms-list{list-style:none;margin:4px 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
.ms-row{display:grid;grid-template-columns:auto minmax(0,1fr) 152px auto;gap:6px;align-items:center}
.ms-row input[type="checkbox"]{width:18px;height:18px;margin:0;accent-color:var(--ok)}
.ar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.icon-x{width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.icon-x:hover{color:var(--stop);border-color:var(--stop)}
.is-readonly .lane{cursor:default}

@media (max-width: 760px){
  :root{--label-w:158px;--lane-h:50px}
  .brand input.board-title{font-size:32px}
  .quick-add{grid-template-columns:1fr 1fr}
  .quick-add #qa-text,.quick-add button[type="submit"]{grid-column:1/-1}
  .top-actions{margin-left:0;width:100%}
  .field-row{grid-template-columns:1fr}
}
@media (max-width: 420px){
  :root{--label-w:128px}
  .label .icon-btn{display:none}
  .label{gap:4px;padding-right:8px}
  .label .btn-sm{padding:3px 6px;font-size:11px}
}
/* ---------- shared bits for small screens and touch ---------- */
.btn-more{display:none;font-size:18px;line-height:1;padding:7px 12px}
.more-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:45;min-width:190px;display:flex;flex-direction:column;padding:6px;background:var(--panel-2);border:1px solid var(--rule);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.more-menu[hidden]{display:none !important}
.more-menu button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:8px;font-size:15px;color:var(--ink);cursor:pointer}
.more-menu button:hover{background:var(--panel)}
td.c-break{display:none}
.only-touch{display:none}
@media (pointer: coarse){
  .only-touch{display:inline}
  .only-mouse{display:none}
  .kbd-hint{display:none !important}
  .btn{min-height:38px}
  .btn-sm{min-height:32px}
  .link-btn{padding:7px 6px}
  .node::after,.flag-mark::after{content:"";position:absolute;inset:-12px;border-radius:50%}
}

/* ---------- phone ---------- */
@media (max-width: 640px){
  :root{--label-w:0px;--lane-h:42px;--axis-h:44px}
  .wrap{gap:14px;padding:calc(14px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))}
  .btn-word{display:none}

  /* header: name + New + menu on one row, tabs and save status below */
  .top{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px 8px;align-items:center}
  .top-actions{display:contents}
  .brand{grid-column:1;grid-row:1;gap:8px;min-width:0;flex-wrap:nowrap}
  .logo{width:28px;height:28px}
  .brand input.board-title{font-size:21px;max-width:100%}
  .today-stamp{display:none}
  #btn-new-project{grid-column:2;grid-row:1}
  .btn-more{display:inline-flex;grid-column:3;grid-row:1}
  #btn-sync,#btn-backup{display:none !important}
  .views{grid-column:1;grid-row:2;justify-self:start}
  .view-tab{padding:6px 16px}
  .save-status{grid-column:2 / -1;grid-row:2;justify-self:end}
  .more-menu{top:46px}

  /* log bar sits at the bottom like a chat box */
  .quick-add{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    grid-template-columns:minmax(0,36%) minmax(0,1fr) auto;gap:6px;
    padding:10px max(10px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    border-radius:16px 16px 0 0;border-width:1px 0 0;
    background:rgba(13,17,28,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:0 -10px 30px rgba(0,0,0,.35);
  }
  .quick-add #qa-date{display:none}
  .quick-add #qa-text,.quick-add button[type="submit"]{grid-column:auto}
  .quick-add .qa-error{order:-1}
  input[type="text"],input[type="date"],input[type="search"],input:not([type]),select,textarea{font-size:16px}

  /* timeline: each project's name sits above its line, so the line gets the full width */
  .tl-toolbar{gap:8px}
  .seg button{padding:5px 11px}
  .range-label{width:100%;font-size:12px}
  .row{grid-template-columns:1fr;min-height:0;padding-top:8px}
  .label{position:sticky;left:0;max-width:calc(100vw - 28px);padding:0;background:none;gap:8px;align-items:stretch}
  .label-box{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:1px 8px;padding:6px 10px;border:0;border-left:3px solid var(--pc);border-radius:6px;background:rgba(17,22,36,.78)}
  .label-meta br{display:none}
  .label-meta .due{margin-left:6px}
  .row.ended .label-box{background:rgba(17,22,36,.45)}
  .label-acts{flex-direction:row;align-items:center}
  .label .icon-btn{display:inline-flex}
  .axis-row{grid-template-columns:1fr}
  .axis-spacer{display:none}
  .tick.is-today .tick-wd{font-size:8.5px}
  .divider{padding-top:16px}
  .empty{padding:24px 0}
  .stat{font-size:12px;padding:4px 9px}
  .week-stats{margin-left:0;width:100%}
  .week{display:flex;flex-direction:column;gap:10px}
  .week{align-items:stretch}
  .view-tab{padding:6px 13px}
  .save-status.is-ok,.save-status.is-saving{font-size:0;gap:0}
  .save-status.is-warn,.save-status.is-err{grid-column:1 / -1;grid-row:3;justify-self:end}
  .day{min-height:0}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}
  .chip{flex:none}
  .label-meta .drift{margin-left:6px}
  .ms-row{grid-template-columns:auto minmax(0,1fr) auto}
  .ms-row input[type="date"]{grid-column:2;grid-row:2}
  .reminder{font-size:13.5px;padding:8px 12px;gap:2px 10px}
  .reminder .msg{min-width:0}

  /* pop-ups slide up from the bottom */
  .modal-backdrop{place-items:end center;padding:0}
  .modal{width:100%;max-height:92vh;border-radius:18px 18px 0 0;border-width:1px 0 0;padding:18px max(18px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left))}
  .modal-actions .btn{flex:1 1 auto;justify-content:center}
  .field-row{grid-template-columns:1fr}

  /* tables become cards */
  .view-table h2{font-size:17px}
  .filters{width:100%}
  .filters select,.filters input[type="search"]{flex:1 1 140px;min-width:0;width:auto}
  .table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block}
  .table-wrap thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .table-wrap tr{padding:12px 14px;border-bottom:1px solid var(--rule)}
  .table-wrap tr:last-child{border-bottom:0}
  .table-wrap td{border:0;padding:0}
  td.text{min-width:0}
  td.actions{text-align:left}
  #projects-body tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
  #projects-body .c-color{order:1}
  #projects-body .c-name{order:2;flex:1 1 calc(100% - 190px);min-width:0;font-size:15px}
  #projects-body .c-status{order:3}
  #projects-body td.c-break{display:block;order:4;flex-basis:100%;height:0}
  #projects-body .c-meta{order:5;font-size:12.5px}
  #projects-body .c-meta::before{content:attr(data-label) " ";color:var(--muted);font-family:var(--font-body)}
  #projects-body .c-acts{order:6;flex-basis:100%;margin-left:-6px}
  #updates-body tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
  #updates-body .c-date{grid-column:1;grid-row:1}
  #updates-body .c-proj{grid-column:2;grid-row:1;min-width:0;font-size:13px;color:var(--muted)}
  #updates-body .c-acts{grid-column:3;grid-row:1}
  #updates-body .c-text{grid-column:1 / -1;grid-row:2}
  #updates-body tr.editing{grid-template-columns:1fr}
  #updates-body tr.editing > td{grid-column:1 / -1;grid-row:auto}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

<body>
<template id="app-shell">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 2.5 20.4 15.6 33.5 18 20.4 20.4 18 33.5 15.6 20.4 2.5 18 15.6 15.6Z"/><path class="core" d="M18 10.5 19 17 25.5 18 19 19 18 25.5 17 19 10.5 18 17 17Z"/></svg>
      <label for="board-title" class="sr-only">Board name</label>
      <input id="board-title" class="board-title" type="text" maxlength="40" spellcheck="false" autocomplete="off">
      <span class="today-stamp" id="today-stamp"></span>
    </div>
    <nav class="views" aria-label="Views">
      <a class="view-tab" href="#week" data-view="week">Week</a>
      <a class="view-tab" href="#timeline" data-view="timeline">Timeline</a>
      <a class="view-tab" href="#table" data-view="table">Table</a>
    </nav>
    <div class="top-actions">
      <span class="save-status" id="save-status" role="status"></span>
      <button type="button" class="btn" id="btn-sync" hidden>GitHub sync</button>
      <button type="button" class="btn" id="btn-backup">Backup</button>
      <button type="button" class="btn primary edit-only" id="btn-new-project">+ New<span class="btn-word"> project</span></button>
      <button type="button" class="btn btn-more" id="btn-more" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu" aria-label="More">&#x22EF;</button>
      <div class="more-menu" id="more-menu" hidden>
        <button type="button" id="mm-sync">GitHub sync</button>
        <button type="button" id="mm-backup">Backup</button>
      </div>
    </div>
  </header>

  <div class="sample-banner edit-only" id="sample-banner" hidden>
    <strong>Example projects</strong>
    <span>These show how the board works. Clear them when you're ready to add your own.</span>
    <button type="button" class="link-btn" id="btn-clear-sample">Clear examples</button>
    <button type="button" class="link-btn" id="btn-keep-sample">Keep them</button>
  </div>

  <div class="reminders" id="reminders" role="status" hidden></div>


  <form class="quick-add edit-only" id="quick-add" autocomplete="off">
    <label for="qa-project" class="sr-only">Project</label>
    <select id="qa-project"></select>
    <label for="qa-date" class="sr-only">Day</label>
    <input type="date" id="qa-date">
    <label for="qa-text" class="sr-only">What you did</label>
    <input type="text" id="qa-text" maxlength="2000" placeholder="What did you do today?">
    <button type="submit" class="btn primary">Log<span class="btn-word"> update</span></button>
    <p class="qa-error" id="qa-error" hidden></p>
  </form>

  <main>
    <section id="view-week" class="view-week" aria-label="Week" hidden>
      <div class="tl-toolbar">
        <div class="tl-nav">
          <button type="button" class="btn btn-sm" id="week-prev" aria-label="Earlier days">&larr;<span class="btn-word"> Earlier</span></button>
          <button type="button" class="btn btn-sm" id="week-today">Today</button>
          <button type="button" class="btn btn-sm" id="week-next" aria-label="Later days"><span class="btn-word">Later </span>&rarr;</button>
        </div>
        <span class="range-label" id="week-label"></span>
        <div class="week-stats" id="week-stats"></div>
      </div>
      <div class="week" id="week-grid"></div>
    </section>

    <section id="view-timeline" class="view-timeline" aria-label="Timeline" hidden>
      <div class="tl-toolbar">
        <div class="seg" id="range-seg" role="group" aria-label="Days shown">
          <button type="button" data-range="7">Week</button>
          <button type="button" data-range="14">2 weeks</button>
          <button type="button" data-range="30">Month</button>
        </div>
        <div class="tl-nav">
          <button type="button" class="btn btn-sm" id="btn-prev" aria-label="Earlier days">&larr;<span class="btn-word"> Earlier</span></button>
          <button type="button" class="btn btn-sm" id="btn-today">Today</button>
          <button type="button" class="btn btn-sm" id="btn-next" aria-label="Later days"><span class="btn-word">Later </span>&rarr;</button>
        </div>
        <span class="range-label" id="range-label"></span>
        <div class="chips" id="area-chips" role="group" aria-label="Show area"></div>
      </div>
      <div class="tl-scroll" id="tl-scroll">
        <div class="board" id="board"></div>
      </div>
    </section>

    <section id="view-table" class="view-table" aria-label="Table" hidden>
      <div class="table-head">
        <h2>Projects</h2>
        <div class="filters"><button type="button" class="btn btn-sm edit-only" data-act="areas">Edit areas</button><label class="check"><input type="checkbox" id="f-archived"> Show archived</label></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th style="width:44px"><span class="sr-only">Color</span></th><th>Project</th><th>Area</th><th>Started</th><th>Deadline</th><th>Updates</th><th>Last update</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="projects-body"></tbody>
        </table>
      </div>

      <div class="table-head">
        <h2>Updates <span class="count" id="updates-count"></span></h2>
        <div class="filters">
          <label for="f-project" class="sr-only">Filter by project</label>
          <select id="f-project"></select>
          <label for="f-search" class="sr-only">Search updates</label>
          <input type="search" id="f-search" placeholder="Search updates">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Project</th><th>Update</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="updates-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-body"></div>
</div>
<div class="tooltip" id="tooltip" hidden></div>

        if (!c.token) return fail('Paste your access token.');
        go.disabled = true;
        msg.textContent = 'Checking the repository…';
        ghRepoCheck(c).then(function () {
          msg.textContent = 'Reading ' + c.path + '…';
          return ghGet(c);
        }).then(function (res) {
          try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch (er) {}
          gh = c; mode = 'github';
          if (!res.missing && res.data.rev >= state.rev) {
            ghSha = res.sha; state = res.data; dirty = false; cacheLocal();
            closeModal(); render(); setStatus('gh');
            return;
          }
          ghSha = res.missing ? null : res.sha;
          dirty = true; closeModal(); render();
          return ghPush();
        }).catch(function (e) { fail(e.message || 'Couldn’t reach GitHub.'); });
      }
    });
  }

  /* ================= rendering ================= */
  function currentView() { return location.hash === '#table' ? 'table' : location.hash === '#timeline' ? 'timeline' : 'week'; }

  function render() {
    var T = todayISO();
    autoEndPass(T);
    document.body.classList.toggle('is-readonly', mode === 'readonly');
    renderHeader(T);
    renderReminders(T);
    renderQuickAdd(T);
    var view = currentView();
    $$('.view-tab').forEach(function (a) { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $('#view-week').hidden = view !== 'week';
    $('#view-timeline').hidden = view !== 'timeline';
    $('#view-table').hidden = view !== 'table';
    if (view === 'week') renderWeek(T); else if (view === 'timeline') renderBoard(T); else renderTables(T);
  }

  function renderHeader(T) {
    var t = $('#board-title');
    if (document.activeElement !== t) t.value = state.title;
    t.readOnly = mode === 'readonly';
    t.size = Math.max(3, (t.value || '').length + 1);
    $('#today-stamp').textContent = fmtLong(T) + ', ' + T.slice(0, 4);
    $('#sample-banner').hidden = !hasSamples();
    $('#btn-sync').hidden = inViewer;
    $('#mm-sync').hidden = inViewer;
  }

  function renderQuickAdd(T) {
    var sel = $('#qa-project');
    var active = state.projects.filter(function (p) { return !p.ended; });
    var cur = sel.value || sel.dataset.want || '';
    if (!active.length) {
      sel.innerHTML = '<option value="">No active projects yet</option>';
      sel.disabled = true;
    } else {
      sel.disabled = false;
      sel.innerHTML = active.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('');
      if (active.some(function (p) { return p.id === cur; })) sel.value = cur;
    }
    sel.dataset.want = '';
    var d = $('#qa-date');
    d.max = T;
    if (!d.value || d.value > T) d.value = T;
  }

  var dismissed = {};
  function dismissBtn(key, label) { return '<button type="button" class="link-btn" data-act="dismiss" data-key="' + esc(key) + '">' + (label || 'Dismiss') + '</button>'; }

  function recapHTML(T) {
    var off = (dow(T) + 6) % 7;            // 0 = Monday
    if (off > 2) return '';                // shown Monday to Wednesday
    var mon = addDays(T, -off), from = addDays(mon, -7), to = addDays(mon, -1), key = 'recap|' + mon;
    if (dismissed[key]) return '';
    var ups = state.updates.filter(function (u) { return u.date >= from && u.date <= to; });
    var wasActive = state.projects.filter(function (p) { return p.start < mon && (!p.ended || p.ended >= from); });
    if (!ups.length && !wasActive.length) return '';
    var per = {}, top = null;
    ups.forEach(function (u) { per[u.projectId] = (per[u.projectId] || 0) + 1; });
    Object.keys(per).forEach(function (id) { if (!top || per[id] > per[top]) top = id; });
    var quiet = wasActive.filter(function (p) { return !per[p.id] && !p.ended; });
    var due = dueItems().filter(function (it) { return !it.done && it.date >= mon && it.date <= addDays(mon, 6); });
    var parts = ['<b>Last week</b> (' + fmtShort(from) + '–' + fmtShort(to) + '): ' + plural(ups.length, 'update') + ' on ' + plural(Object.keys(per).length, 'project') + '.'];
    if (top && getProject(top)) parts.push('Most active: <b>' + esc(getProject(top).name) + '</b> (' + per[top] + ').');
    if (quiet.length) parts.push('Went quiet: ' + quiet.slice(0, 3).map(function (p) { return esc(p.name); }).join(', ') + '.');
    parts.push(due.length ? 'Due this week: ' + due.slice(0, 4).map(function (it) {
      return esc(it.kind === 'deadline' ? it.p.name + ' deadline' : it.title) + ' (' + WD[dow(it.date)] + ')';
    }).join(', ') + '.' : 'Nothing due this week.');
    return '<div class="reminder is-recap">' + ORBIT + '<span class="msg">' + parts.join(' ') + '</span><span class="reminder-acts">' + dismissBtn(key, 'Got it') + '</span></div>';
  }

  function renderReminders(T) {
    var box = $('#reminders'), cards = [], soonCount = 0;
    dueItems().forEach(function (it) {
      if (it.done) return;
      var n = diffDays(T, it.date);
      if (n < 0 || n > DUE_SOON) return;
      soonCount++;
      var key = 'due|' + it.kind + '|' + (it.m ? it.m.id : it.p.id) + '|' + it.date + '|' + T;
      if (dismissed[key]) return;
      var cls = 'reminder' + (n <= 0 ? ' is-today' : ''), h;
      if (it.kind === 'deadline') {
        h = '<div class="' + cls + '">' + FLAG + '<span class="msg"><b>' + esc(it.p.name) + '</b> is due <b>' + dueLabel(n) + '</b> (' + fmtLong(it.date) + '). ' +
          (n <= 0 ? 'It ends automatically when today is over.' : 'It ends automatically after that day.') + '</span><span class="reminder-acts">' +
          '<button type="button" class="link-btn edit-only" data-act="deadline" data-pid="' + esc(it.p.id) + '">Move deadline</button>' +
          '<button type="button" class="link-btn edit-only" data-act="end" data-pid="' + esc(it.p.id) + '">End now</button>' +
          dismissBtn(key) + '</span></div>';
      } else if (it.kind === 'milestone') {
        h = '<div class="' + cls + '">' + DIAMOND + '<span class="msg"><b>' + esc(it.m.title) + '</b> for ' + esc(it.p.name) + ' is due <b>' + dueLabel(n) + '</b> (' + fmtLong(it.date) + ').</span><span class="reminder-acts">' +
          '<button type="button" class="link-btn edit-only" data-act="ms-done" data-pid="' + esc(it.p.id) + '" data-mid="' + esc(it.m.id) + '">Mark done</button>' +
          '<button type="button" class="link-btn edit-only" data-act="milestone" data-pid="' + esc(it.p.id) + '" data-mid="' + esc(it.m.id) + '">Edit</button>' +
          dismissBtn(key) + '</span></div>';
      }
      cards.push({ n: n, html: h });
    });
    cards.sort(function (a, b) { return a.n - b.n; });
    recentlyForced(T).forEach(function (p) {
      var key = 'forced|' + p.id + '|' + p.ended + '|' + T;
      if (dismissed[key]) return;
      cards.push({ n: 100, html: '<div class="reminder is-forced">' + XICO +
        '<span class="msg"><b>' + esc(p.name) + '</b> reached its deadline on ' + fmtLong(p.ended) + ' and was ended.</span>' +
        '<span class="reminder-acts"><button type="button" class="link-btn edit-only" data-act="reopen" data-pid="' + esc(p.id) + '">Reopen with a new deadline</button>' + dismissBtn(key) + '</span></div>' });
    });
    var drift = state.projects.filter(function (p) { return isDrifting(p, T); }).sort(function (a, b) { return driftDays(b, T) - driftDays(a, T); });
    var dk = 'drift|' + T;
    if (drift.length && !dismissed[dk]) {
      cards.push({ n: 200, html: '<div class="reminder is-drift">' + ORBIT + '<span class="msg">Drifting out of orbit: ' +
        drift.slice(0, 3).map(function (p) { return '<b>' + esc(p.name) + '</b> (' + driftDays(p, T) + ' days quiet)'; }).join(', ') +
        (drift.length > 3 ? ' and ' + (drift.length - 3) + ' more' : '') + '. One line today pulls ' + (drift.length > 1 ? 'them' : 'it') + ' back.</span><span class="reminder-acts">' +
        drift.slice(0, 2).map(function (p) { return '<button type="button" class="link-btn edit-only" data-act="log-project" data-pid="' + esc(p.id) + '">Log ' + esc(truncate(p.name, 22)) + '</button>'; }).join('') +
        dismissBtn(dk) + '</span></div>' });
    }
    var rc = recapHTML(T);
    if (rc) cards.push({ n: 300, html: rc });
    var cap = isPhone() ? 2 : 3;
    var shown = ui.allReminders ? cards : cards.slice(0, cap);
    box.innerHTML = shown.map(function (c) { return c.html; }).join('') +
      (cards.length > cap ? '<button type="button" class="link-btn reminders-more" data-act="more-reminders">' + (ui.allReminders ? 'Show fewer' : 'Show ' + (cards.length - cap) + ' more') + '</button>' : '');
    box.hidden = !cards.length;
    document.title = (soonCount ? '(' + soonCount + ') ' : '') + BASE_TITLE;
  }

  function renderWeek(T) {
    var center = addDays(T, ui.weekOffset), phone = isPhone();
    var days = []; for (var i = -2; i <= 2; i++) days.push(addDays(center, i));
    $('#week-label').textContent = fmtShort(days[0]) + ' – ' + fmtYear(days[4]);
    $('#week-today').disabled = ui.weekOffset === 0;
    var st = streakInfo(T), wkFrom = addDays(T, -6);
    var wk = state.updates.filter(function (u) { return u.date >= wkFrom && u.date <= T; }).length;
    $('#week-stats').innerHTML =
      '<span class="stat' + (st.today ? '' : ' is-warn') + '" title="Days in a row with at least one update">' + STAR + '<b>' + st.n + '</b> day' + (st.n === 1 ? '' : 's') + ' in a row' +
        (st.today ? '' : '<em>· ' + (st.n ? 'log today to keep it' : 'log today to start') + '</em>') + '</span>' +
      '<span class="stat"><b>' + wk + '</b> update' + (wk === 1 ? '' : 's') + ' this week</span>';
    var byDay = {}, dueBy = {};
    state.updates.forEach(function (u) { if (u.date >= days[0] && u.date <= days[4]) (byDay[u.date] || (byDay[u.date] = [])).push(u); });
    dueItems().forEach(function (it) { if (it.date >= days[0] && it.date <= days[4]) (dueBy[it.date] || (dueBy[it.date] = [])).push(it); });
    state.projects.forEach(function (p) {
      if (p.ended && p.ended >= days[0] && p.ended <= days[4]) (dueBy[p.ended] || (dueBy[p.ended] = [])).push({ kind: 'ended', date: p.ended, p: p, title: p.name });
    });
    function dueHTML(it) {
      var n = diffDays(T, it.date);
      var cls = 'due-item kind-' + it.kind + (it.done ? ' is-done' : '') +
        (!it.done && it.kind !== 'ended' && n >= 0 && n <= DUE_SOON ? ' is-soon' : '');
      var icon = it.kind === 'deadline' ? FLAG : it.kind === 'milestone' ? DIAMOND : XICO;
      var title = it.kind === 'deadline' || it.kind === 'ended' ? it.p.name : it.title;
      var kind = it.kind === 'deadline' ? 'Final deadline' : it.kind === 'milestone' ? it.p.name : (it.p.endedBy === 'deadline' ? 'Hit its deadline' : 'Ended');
      var act = it.kind === 'deadline' ? 'data-act="deadline" data-pid="' + esc(it.p.id) + '"'
        : it.kind === 'milestone' ? 'data-act="milestone" data-pid="' + esc(it.p.id) + '" data-mid="' + esc(it.m.id) + '"'
        : 'data-act="project" data-pid="' + esc(it.p.id) + '"';
      return '<li><button type="button" class="' + cls + '" ' + act + (it.p ? ' style="--pc:var(--c' + it.p.color + ')"' : '') + '>' + icon +
        '<span class="due-text"><span class="due-title">' + esc(title) + '</span><span class="due-kind">' + esc(kind) + (it.done ? ' · done' : '') + '</span></span></button></li>';
    }
    function dayHTML(d) {
      var ups = (byDay[d] || []).slice().sort(function (a, b) { return a.created - b.created; });
      var due = dueBy[d] || [];
      var rel = d === T ? 'Today' : d === addDays(T, 1) ? 'Tomorrow' : d === addDays(T, -1) ? 'Yesterday' : WD[dow(d)];
      var h = '<section class="day' + (d === T ? ' is-today' : d < T ? ' is-past' : ' is-future') + '" aria-label="' + fmtLong(d) + '">' +
        '<header class="day-head"><span class="day-rel">' + rel + '</span><span class="day-date">' + (rel === WD[dow(d)] ? fmtShort(d) : WD[dow(d)] + ', ' + fmtShort(d)) + '</span>' +
        (ups.length ? '<span class="day-count" title="' + plural(ups.length, 'update') + '">' + ups.length + '</span>' : '') + '</header>';
      if (due.length) h += '<ul class="day-due">' + due.map(dueHTML).join('') + '</ul>';
      if (ups.length) {
        h += '<ul class="day-log">' + ups.map(function (u) {
          var p = getProject(u.projectId); if (!p) return '';
          return '<li><button type="button" class="log-item" data-act="open-day" data-pid="' + esc(p.id) + '" data-date="' + d + '" style="--pc:var(--c' + p.color + ')">' +
            '<span class="log-proj"><i class="pdot"></i>' + esc(p.name) + '</span><span class="log-text">' + esc(u.text) + '</span></button></li>';
        }).join('') + '</ul>';
      }
      if (!ups.length && !due.length) h += '<p class="day-empty">' + (d > T ? 'Nothing due' : d === T ? 'Nothing logged yet' : 'Quiet day') + '</p>';
      if (d <= T) h += '<button type="button" class="day-add edit-only" data-act="log-day" data-date="' + d + '">+ Log' + (d === T ? '' : ' for ' + WD[dow(d)]) + '</button>';
      return h + '</section>';
    }
    $('#week-grid').innerHTML = (phone && ui.weekOffset === 0)
      ? dayHTML(days[2]) + dayHTML(days[3]) + dayHTML(days[4]) + '<div class="week-divider"><span>Earlier</span></div>' + dayHTML(days[1]) + dayHTML(days[0])
      : days.map(dayHTML).join('');
  }

  function renderBoard(T) {
    var past = ui.range, fut = FUTURE[past] || 0, N = past + fut, phone = isPhone();
    var last = addDays(T, fut - ui.offset);
    var first = addDays(last, -(N - 1));
    var dates = []; for (var i = 0; i < N; i++) dates.push(addDays(first, i));

    $('#range-label').textContent = fmtShort(first) + ' – ' + fmtYear(last);
    $$('#range-seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.range === past)); });
    $('#btn-next').disabled = ui.offset <= 0;
    $('#btn-today').disabled = ui.offset <= 0;
    if (ui.area !== 'all' && !state.areas.some(function (a) { return a.id === ui.area; })) ui.area = 'all';
    var areaCount = {};
    state.projects.forEach(function (p) { if (statusOf(p, T) !== 'archived' && p.area) areaCount[p.area] = (areaCount[p.area] || 0) + 1; });
    $('#area-chips').innerHTML = '<button type="button" class="chip" data-area="all" aria-pressed="' + (ui.area === 'all') + '">All</button>' +
      state.areas.map(function (a) {
        return '<button type="button" class="chip" data-area="' + esc(a.id) + '" aria-pressed="' + (ui.area === a.id) + '">' + esc(a.name) + (areaCount[a.id] ? '<span class="n">' + areaCount[a.id] + '</span>' : '') + '</button>';
      }).join('');

    var board = $('#board');
    board.style.setProperty('--days', N);
    board.style.minWidth = 'calc(var(--label-w) + ' + (N * (phone ? MIN_COL_PHONE : MIN_COL)[past]) + 'px)';
    board.dataset.start = first;
    board.dataset.days = N;

    var groups = groupUpdates();
    var vis = boardProjects(T);
    var colW = 100 / N, ti = diffDays(first, T);
    function idx(d) { return diffDays(first, d); }
    function cx(i) { return (i + 0.5) * colW; }
    function seg(cls, a, b, fadeR) {
      var l = Math.max(0, a), r = Math.min(100, b);
      if (r - l < 0.05) return '';
      cls += (a < 0 ? ' runs-left' : '') + ((b > 100 || fadeR) ? ' runs-right' : '');
      return '<div class="' + cls + '" style="left:' + l.toFixed(3) + '%;width:' + (r - l).toFixed(3) + '%"></div>';
    }

    function rowHTML(p, st) {
      var ups = groups[p.id] || {};
      var f = firstDate(p), si = idx(f), out = '';
      if (p.ended) {
        out += seg('line', cx(si), cx(idx(p.ended)));
      } else {
        out += seg('line', cx(si), cx(ti));
        if (p.deadline) out += seg('line plan', cx(ti), cx(idx(p.deadline)));
        else out += seg('line stub', cx(ti), cx(ti) + colW * 0.9, true);
      }
      Object.keys(ups).forEach(function (d) {
        var k = idx(d);
        if (k < 0 || k > N - 1) return;
        var n = ups[d].length;
        out += '<button type="button" class="node' + (n > 1 ? ' multi' : '') + (justAdded === p.id + '|' + d ? ' just-added' : '') +
          '" data-pid="' + esc(p.id) + '" data-date="' + d + '" style="left:' + cx(k).toFixed(3) + '%" aria-label="' +
          esc(p.name) + ': ' + plural(n, 'update') + ' on ' + fmtLong(d) + '">' + (n > 1 ? n : '') + '</button>';
      });
      if (p.ended) {
        var ei = idx(p.ended);
        if (ei >= 0 && ei <= N - 1) out += '<span class="xmark" style="left:' + cx(ei).toFixed(3) + '%" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5.5 L19.5 18.5"/><path d="M18.5 4.5 L5.5 19.5"/></svg></span>';
      } else if (p.deadline) {
        var di = idx(p.deadline), dl = diffDays(T, p.deadline), soon = dl <= DUE_SOON;
        var tip = 'Deadline: ' + fmtLong(p.deadline) + ' (' + dueLabel(dl) + ')';
        if (di <= N - 1) {
          out += mode === 'readonly'
            ? '<span class="flag-mark' + (soon ? ' is-soon' : '') + '" style="left:' + cx(di).toFixed(3) + '%" title="' + esc(tip) + '">' + FLAG + '</span>'
            : '<button type="button" class="flag-mark' + (soon ? ' is-soon' : '') + '" data-act="deadline" data-pid="' + esc(p.id) + '" style="left:' + cx(di).toFixed(3) + '%" title="' + esc(tip) + '" aria-label="' + esc(tip) + '. Change deadline">' + FLAG + '</button>';
        } else {
          out += '<span class="due-off' + (soon ? ' is-soon' : '') + '" title="' + esc(tip) + '">due ' + fmtShort(p.deadline) + ' →</span>';
        }
      }
      p.milestones.forEach(function (m) {
        var mi = idx(m.date);
        if (mi < 0 || mi > N - 1) return;
        var ml = diffDays(T, m.date), soonM = !m.done && ml >= 0 && ml <= DUE_SOON;
        var tipM = m.title + ' · ' + fmtLong(m.date) + (m.done ? ' · done' : ml >= 0 ? ' (' + dueLabel(ml) + ')' : '');
        out += '<button type="button" class="ms-mark' + (m.done ? ' is-done' : '') + (soonM ? ' is-soon' : '') + '" data-act="milestone" data-pid="' + esc(p.id) + '" data-mid="' + esc(m.id) +
          '" style="left:' + cx(mi).toFixed(3) + '%" title="' + esc(tipM) + '" aria-label="Milestone: ' + esc(tipM) + '">' + DIAMOND + '</button>';
      });
      var n = countFor(p.id), meta;
      if (st === 'active') {
        meta = plural(n, 'update') + ' · since ' + fmtShort(f);
        if (p.deadline) {
          var d2 = diffDays(T, p.deadline);
          meta += '<br><span class="due' + (d2 <= DUE_SOON ? ' is-soon' : '') + '">' + FLAG + 'due ' + (d2 <= DUE_SOON ? dueLabel(d2) : fmtShort(p.deadline) + ' · ' + d2 + ' days') + '</span>';
        }
      } else {
        var left2 = KEEP_DAYS - diffDays(p.ended, T);
        meta = (p.endedBy === 'deadline' ? 'Hit deadline ' : 'Ended ') + fmtShort(p.ended) + ' · ' + (left2 <= 1 ? 'leaves tomorrow' : 'leaves in ' + left2 + ' days');
      }
      var dlTitle = p.deadline ? 'Change deadline' : 'Set a deadline';
      var btns = st === 'active'
        ? '<button type="button" class="btn btn-sm edit-only" data-act="end" data-pid="' + esc(p.id) + '" title="End this project">End</button>' +
          '<button type="button" class="btn btn-sm icon-btn edit-only" data-act="deadline" data-pid="' + esc(p.id) + '" title="' + dlTitle + '" aria-label="' + dlTitle + '">' + FLAG + '</button>'
        : '<button type="button" class="btn btn-sm btn-quiet edit-only" data-act="reopen" data-pid="' + esc(p.id) + '" title="Undo the end">Reopen</button>';
      return '<div class="row ' + st + (isDrifting(p, T) ? ' drifting' : '') + '" style="--pc:var(--c' + p.color + ')">' +
        '<div class="label"><button type="button" class="label-box" data-act="project" data-pid="' + esc(p.id) + '" title="Edit project"><span class="label-name">' + esc(p.name) +
        (areaOf(p) ? '<span class="area-tag">' + esc(areaOf(p).name) + '</span>' : '') + '</span><span class="label-meta">' + meta +
        (isDrifting(p, T) ? '<br><span class="drift">quiet for ' + driftDays(p, T) + ' days</span>' : '') + '</span></button>' +
        '<div class="label-acts">' + btns + '</div></div>' +
        '<div class="lane" data-pid="' + esc(p.id) + '">' + out + '<span class="ghost" aria-hidden="true">+</span></div></div>';
    }

    var html = '<div class="cols" aria-hidden="true">' + dates.map(function (d) {
      return '<div class="col' + (d === T ? ' is-today' : '') + (d > T ? ' is-future' : (isWeekend(d) ? ' is-wknd' : '')) + '"></div>';
    }).join('') + '</div>';

    if (!vis.active.length && !vis.ended.length) {
      html += '<div class="empty"><p>' + (ui.area !== 'all' && state.projects.length ? 'No projects in this area yet.' : 'Nothing on the board yet.') + '</p><button type="button" class="btn primary edit-only" data-act="new-project">+ New project</button>' +
        (!inViewer && !gh ? '<button type="button" class="btn" data-act="sync">Load my board from GitHub</button>' : '') + '</div>';
    }
    html += vis.active.map(function (p) { return rowHTML(p, 'active'); }).join('');
    if (vis.ended.length) {
      html += '<div class="divider"><span>Ended · each leaves the board ' + KEEP_DAYS + ' days after its ✕</span></div>';
      html += vis.ended.map(function (p) { return rowHTML(p, 'ended'); }).join('');
    }

    var wdLen = phone ? (past <= 7 ? 2 : 1) : (past <= 7 ? 3 : past <= 14 ? 2 : 1);
    html += '<div class="axis-row" aria-hidden="true"><div class="axis-spacer"></div><div class="axis">' + dates.map(function (d, i) {
      var day = +d.slice(8);
      var label = phone ? String(day) : (past <= 7 || i === 0 || day === 1) ? fmtShort(d) : String(day);
      var wd = d === T && (!phone || past <= 7) ? 'Today' : WD[dow(d)].slice(0, wdLen);

  /* ================= tooltip ================= */
  function showTip(node) {
    var p = getProject(node.dataset.pid); if (!p) return;
    var d = node.dataset.date, list = updatesFor(p.id, d), tip = $('#tooltip');
    tip.innerHTML = '<div class="tip-head">' + esc(p.name) + ' · ' + fmtLong(d) + '</div><ul>' +
      list.slice(0, 4).map(function (u) { return '<li>' + esc(truncate(u.text, 170)) + '</li>'; }).join('') + '</ul>' +
      (list.length > 4 ? '<div class="tip-foot">+' + (list.length - 4) + ' more</div>' : '') +
      '<div class="tip-foot">Click to open, edit or add</div>';
    tip.hidden = false;
    var r = node.getBoundingClientRect(), tr = tip.getBoundingClientRect();
    var left = Math.max(8, Math.min(r.left + r.width / 2 - tr.width / 2, window.innerWidth - tr.width - 8));
    var top = r.top - tr.height - 10; if (top < 8) top = r.bottom + 10;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  function hideTip() { var t = $('#tooltip'); if (t) t.hidden = true; }

  /* ================= modal ================= */
  var modalCtx = null, lastFocus = null;
  function openModal(ctx) {

    modalCtx = ctx; lastFocus = document.activeElement;
    $('#modal').hidden = false;
    ctx.draw();
    var f = $('#modal [autofocus]') || $('#modal input:not([type=hidden]), #modal textarea, #modal button');
    if (f) f.focus();

  function closeModal() {
    if ($('#modal').hidden) return;

  function confirmDialog(o) {

    });

  function addUpdate(pid, d, text) {
    justAdded = pid + '|' + d;
    commit(function (s) {
      s.updates.push({ id: uid(), projectId: pid, date: d, text: text, created: Date.now() });
      var p = null; s.projects.forEach(function (x) { if (x.id === pid) p = x; });
      if (p && d < p.start) p.start = d;
    });
  }

  function openDay(pid, date) {
    var editing = null, confirming = null;
    var ctx = {
      draw: function () {
        var T = todayISO(), p = getProject(pid);
        if (!p) { closeModal(); return; }
        var list = updatesFor(pid, date), can = canAddOn(p, date, T);
        var items = list.map(function (u) {
          if (editing === u.id) {
            return '<li><label for="edit-text" class="sr-only">Edit update</label><textarea id="edit-text" rows="3">' + esc(u.text) + '</textarea>' +
              '<div class="upd-tools"><span class="time"></span><button type="button" class="link-btn" data-act="cancel">Cancel</button><button type="button" class="btn btn-sm primary" data-act="save" data-id="' + esc(u.id) + '">Save</button></div></li>';
          }
          if (confirming === u.id) {

              '<button type="button" class="link-btn" data-act="cancel">Keep</button><button type="button" class="btn btn-sm danger" data-act="del-yes" data-id="' + esc(u.id) + '">Delete</button></div></li>';
          }
          return '<li><div class="upd-text">' + esc(u.text) + '</div><div class="upd-tools"><span class="time">' + (u.created ? 'logged ' + fmtTime(u.created) : '') + '</span>' +
            (mode !== 'readonly' ? '<button type="button" class="link-btn" data-act="edit" data-id="' + esc(u.id) + '">Edit</button><button type="button" class="link-btn danger" data-act="del" data-id="' + esc(u.id) + '">Delete</button>' : '') + '</div></li>';
        }).join('');
        $('#modal-body').innerHTML =
          '<div class="modal-head" style="--pc:var(--c' + p.color + ')"><i class="dot"></i><div><h2 id="modal-title">' + esc(p.name) + '</h2>' +
          '<p class="modal-sub">' + fmtLong(date) + ', ' + date.slice(0, 4) + (date === T ? ' · today' : '') + (p.ended === date ? ' · ended this day' : '') + '</p></div></div>' +
          (list.length ? '<ol class="upd-list">' + items + '</ol>' : '<p class="muted">No updates on this day yet.</p>') +
          (can ? '<form id="day-add"><div class="field"><label for="day-text">Add an update for ' + fmtShort(date) + '</label>' +
            '<textarea id="day-text" rows="3" placeholder="What did you get done?"' + (editing ? '' : ' autofocus') + '></textarea></div>' +
            '<div class="modal-actions"><span class="muted kbd-hint" style="margin-right:auto;font-size:12px;align-self:center">Ctrl/⌘ + Enter to add</span><button type="button" class="btn" data-close>Close</button><button type="submit" class="btn primary">Add update</button></div></form>'
            : '<div class="modal-actions"><button type="button" class="btn" data-close autofocus>Close</button></div>');
        var et = $('#edit-text');
        if (et) { et.focus(); et.setSelectionRange(et.value.length, et.value.length); }
      },
      onClick: function (e) {
        var b = e.target.closest('[data-act]'); if (!b) return;
        var id = b.dataset.id;
        switch (b.dataset.act) {
          case 'edit': editing = id; confirming = null; ctx.draw(); break;
          case 'del': confirming = id; editing = null; ctx.draw(); break;
          case 'cancel': editing = null; confirming = null; ctx.draw(); break;
          case 'del-yes':
            commit(function (s) { s.updates = s.updates.filter(function (u) { return u.id !== id; }); });
            confirming = null; ctx.draw(); break;
          case 'save':
            var v = $('#edit-text').value.trim(); if (!v) { $('#edit-text').focus(); return; }
            commit(function (s) { s.updates.forEach(function (u) { if (u.id === id) u.text = v; }); });
            editing = null; ctx.draw(); break;
        }
      },
      onSubmit: function (e) {

  // One editor for everything about a project: name, area, dates, milestones, color.
  function openProject(pid) {
    if (mode === 'readonly') return;
    var T = todayISO(), p0 = pid ? getProject(pid) : null;
    if (pid && !p0) return;
    var isNew = !p0;
    var d = isNew
      ? { name: '', area: ui.area !== 'all' ? ui.area : null, goal: null, color: leastUsedColor(), start: T, deadline: null, milestones: [], note: '' }
      : { name: p0.name, area: p0.area, goal: p0.goal, color: p0.color, start: p0.start, deadline: p0.deadline, note: '',
          milestones: p0.milestones.map(function (m) { return { id: m.id, title: m.title, date: m.date, done: m.done }; }) };
    function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (v === (cur || '') ? ' selected' : '') + '>' + esc(label) + '</option>'; }
    function msRow(m, i) {
      return '<li class="ms-row"><input type="checkbox" id="ms-d-' + i + '"' + (m.done ? ' checked' : '') + ' title="Done" aria-label="Done">' +
        '<input type="text" id="ms-t-' + i + '" maxlength="100" value="' + esc(m.title) + '" placeholder="e.g. Essay 2, Midterm, Abstract due" aria-label="Milestone name">' +
        '<input type="date" id="ms-a-' + i + '" value="' + esc(m.date || '') + '" aria-label="Milestone date">' +
        '<button type="button" class="icon-x" data-act="del-ms" data-i="' + i + '" aria-label="Remove milestone">×</button></li>';
    }
    function readForm() {
      d.name = $('#pj-name').value;
      d.area = $('#pj-area').value || null;
      d.start = $('#pj-start').value;
      d.deadline = $('#pj-deadline').value || null;
      var c = $('input[name="pj-color"]:checked'); if (c) d.color = +c.value;
      d.milestones.forEach(function (m, i) { m.done = $('#ms-d-' + i).checked; m.title = $('#ms-t-' + i).value; m.date = $('#ms-a-' + i).value; });
      var n = $('#pj-note'); if (n) d.note = n.value;
    }
    var ctx = {
      draw: function () {
        var sw = '';
        for (var i = 0; i < INKS; i++) sw += '<label class="swatch-opt" style="--pc:var(--c' + i + ')"><input type="radio" name="pj-color" value="' + i + '"' + (i === d.color ? ' checked' : '') + ' aria-label="Color ' + (i + 1) + '"><span></span></label>';
        $('#modal-body').innerHTML = '<h2 id="modal-title">' + (isNew ? 'New project' : 'Edit project') + '</h2>' +
          '<form id="pj-form" novalidate>' +
          '<div class="field"><label for="pj-name">Name</label><input id="pj-name" type="text" maxlength="80" value="' + esc(d.name) + '" placeholder="e.g. Physics 101, Exoplanet research"' + (isNew ? ' autofocus' : '') + '></div>' +
          '<div class="field"><label for="pj-area">Area</label><select id="pj-area">' + opt('', 'No area', d.area) +
            state.areas.map(function (a) { return opt(a.id, a.name, d.area); }).join('') + '</select></div>' +
          '<div class="field-row"><div class="field"><label for="pj-start">Start date</label><input id="pj-start" type="date" value="' + esc(d.start) + '" max="' + T + '"></div>' +
          '<div class="field"><label for="pj-deadline">Final deadline <span class="muted">(ends the project)</span></label><input id="pj-deadline" type="date" value="' + esc(d.deadline || '') + '"' + (p0 && p0.ended ? '' : ' min="' + T + '"') + '></div></div>' +
          '<div class="field"><span class="field-label">Milestones <span class="muted">(assignments, exams, submissions; you get a reminder ' + DUE_SOON + ' days before)</span></span>' +
            (d.milestones.length ? '<ul class="ms-list">' + d.milestones.map(msRow).join('') + '</ul>' : '') +
            '<button type="button" class="btn btn-sm" data-act="add-ms" style="align-self:flex-start">+ Add milestone</button></div>' +
          '<div class="field"><fieldset class="swatches"><legend>Line color</legend>' + sw + '</fieldset></div>' +
          (isNew ? '<div class="field"><label for="pj-note">First update <span class="muted">(optional, logged on the start date)</span></label><textarea id="pj-note" rows="2" placeholder="Kickoff, goal, first step…">' + esc(d.note) + '</textarea></div>' : '') +
          '<p class="form-error" id="pj-error" hidden></p>' +
          '<div class="modal-actions">' + (isNew ? '' : '<button type="button" class="btn btn-quiet" data-act="del-project" style="margin-right:auto">Delete project</button>') +
          '<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">' + (isNew ? 'Create project' : 'Save') + '</button></div></form>';
      },
      onClick: function (e) {
        var b = e.target.closest('[data-act]'); if (!b) return;
        if (b.dataset.act === 'add-ms') {
          readForm();
          d.milestones.push({ id: uid(), title: '', date: addDays(T, 7), done: false });
          ctx.draw();
          var t = $('#ms-t-' + (d.milestones.length - 1)); if (t) t.focus();
        } else if (b.dataset.act === 'del-ms') {

          var n = countFor(p0.id);

            body: 'This removes the project and its ' + plural(n, 'update') + ' for good. To keep the history, use <b>End</b> instead.',
            onYes: function () { commit(function (s) { s.projects = s.projects.filter(function (x) { return x.id !== p0.id; }); s.updates = s.updates.filter(function (u) { return u.projectId !== p0.id; }); }); }
          });

      onSubmit: function () {

        if (d.deadline && active && d.deadline < T && (isNew || d.deadline !== p0.deadline)) return fail('The final deadline has to be today or later.');

        }
        ms.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        var note = (d.note || '').trim();
        if (isNew) {
          var id = uid();
          commit(function (s) {
            s.projects.push({ id: id, name: name.slice(0, 80), color: d.color, start: d.start, ended: null, deadline: d.deadline, endedBy: null,
              area: d.area, goal: d.goal, milestones: ms, created: Date.now(), sample: false });

          });

        } else {
          commit(function () {
            p0.name = name.slice(0, 80); p0.color = d.color; p0.start = d.start; p0.deadline = d.deadline;
            p0.area = d.area; p0.goal = d.goal; p0.milestones = ms;
          });
          closeModal();
        }
      }
    };
    openModal(ctx);
  }
  function openNewProject() { openProject(null); }

  function openMilestone(pid, mid) {

          '<div class="field" style="justify-content:flex-end"><label class="check"><input type="checkbox" id="ms-done"' + (m.done ? ' checked' : '') + '> Done</label></div></div>' +
          '<p class="form-error" id="ms-error" hidden></p>' +
          '<div class="modal-actions"><button type="button" class="btn btn-quiet" data-act="del-ms" style="margin-right:auto">Delete</button>' +
          '<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div></form>';
      },
      onClick: function (e) {
        if (e.target.closest('[data-act="del-ms"]')) {

        }
      },
      onSubmit: function () {
        var t = $('#ms-title').value.trim(), dt = $('#ms-date').value, err = $('#ms-error');

        var dn = $('#ms-done').checked;
        commit(function () {
          m.title = t.slice(0, 100); m.date = dt; m.done = dn;

  function openAreas() {
    if (mode === 'readonly') return;
    var list = state.areas.map(function (a) { return { id: a.id, name: a.name }; });
    function read() { list.forEach(function (a, i) { a.name = $('#ar-' + i).value; }); }
    var ctx = {
      draw: function () {
        $('#modal-body').innerHTML = '<h2 id="modal-title">Areas</h2><p class="muted" style="font-size:13px;margin-top:4px">Group projects by part of your life, like research, classes or applications.</p>' +
          '<form id="ar-form" novalidate><ul class="ms-list">' + list.map(function (a, i) {
            return '<li class="ar-row"><input type="text" id="ar-' + i + '" maxlength="30" value="' + esc(a.name) + '" aria-label="Area name"><button type="button" class="icon-x" data-act="del-area" data-i="' + i + '" aria-label="Remove area">×</button></li>';
          }).join('') + '</ul>' +
          '<button type="button" class="btn btn-sm" data-act="add-area" style="align-self:flex-start">+ Add area</button>' +
          '<div class="modal-actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div></form>';
      },
      onClick: function (e) {
